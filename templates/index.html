// Показывает, на какие вопросы сотрудник ответил верно/неверно в конкретной попытке (п.2 запроса)
async function openAnswersModal(assignmentId) {
  const modal = document.getElementById('answersModal');
  const body = document.getElementById('answersModalBody');
  if (!modal || !body) return;
  body.innerHTML = `<div class="text-slate-400 text-sm">${t('loading')}</div>`;
  modal.classList.remove('hidden');
  try {
    const { questions } = await api.getAssignmentAnswers(assignmentId);
    if (!questions.length) {
      body.innerHTML = `<div class="text-slate-400 text-sm">${t('no_data')}</div>`;
      return;
    }
    body.innerHTML = questions.map((q, i) => {
      const opts = parseOpts(CURRENT_LANG === 'kz' ? q.options_kz : q.options_ru);
      const qText = CURRENT_LANG === 'kz' ? q.question_kz : q.question_ru;
      return `
        <div class="border rounded-lg p-3 ${q.is_correct ? 'border-emerald-200 bg-emerald-50/40' : 'border-red-200 bg-red-50/40'}">
          <p class="text-sm font-semibold text-slate-800 mb-2">${i + 1}. ${esc(qText)} ${q.is_correct ? '<span class="text-emerald-600">✓</span>' : '<span class="text-red-600">✗</span>'}</p>
          <div class="space-y-1">
            ${opts.map((o, idx) => {
              let cls = 'text-slate-600';
              let mark = '';
              if (idx === q.correct_index) { cls = 'text-emerald-700 font-semibold'; mark = ' ✓ верный ответ'; }
              if (idx === q.chosen_index && idx !== q.correct_index) { cls = 'text-red-700 font-semibold'; mark = ' ✗ выбран сотрудником'; }
              else if (idx === q.chosen_index && idx === q.correct_index) { mark = ' ✓ выбран сотрудником и верный'; }
              return `<div class="text-xs ${cls}">${esc(o)}${mark}</div>`;
            }).join('')}
            ${q.chosen_index === null ? '<div class="text-xs text-slate-400 italic">Сотрудник не ответил на этот вопрос</div>' : ''}
          </div>
        </div>
      `;
    }).join('');
  } catch (e) {
    body.innerHTML = `<div class="text-red-600 text-sm">${t('error_generic')}</div>`;
  }
}

// --- CALENDAR (АДМИН/СУПЕРАДМИН: КТО ПРОШЁЛ ОБУЧЕНИЕ В ВЫБРАННЫЕ ДАТЫ) ---
// Форматирует дату в YYYY-MM-DD по ЛОКАЛЬНОМУ времени (в отличие от toISOString,
// который переводит в UTC и может сдвинуть дату на день назад/вперёд для часовых поясов вроде UTC+5)
function toLocalDateStr(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function changeCalendarMonth(delta) {
  const d = new Date(state.calendarDate);
  d.setMonth(d.getMonth() + delta);
  state.calendarDate = d;
  loadCalendar();
}

async function loadCalendar() {
  const d = state.calendarDate;
  const year = d.getFullYear();
  const month = d.getMonth(); // 0-based
  const label = document.getElementById('calMonthLabel');
  const monthNames = CURRENT_LANG === 'kz'
    ? ['Қаңтар','Ақпан','Наурыз','Сәуір','Мамыр','Маусым','Шілде','Тамыз','Қыркүйек','Қазан','Қараша','Желтоқсан']
    : ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  if (label) label.textContent = `${monthNames[month]} ${year}`;

  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const dateFrom = toLocalDateStr(firstDay);
  const dateTo = toLocalDateStr(lastDay);

  const grid = document.getElementById('calGrid');
  if (!grid) return;
  grid.innerHTML = `<div class="col-span-7 text-center text-slate-400 py-8">${t('loading')}</div>`;

  let list = [];
  try {
    list = await api.getAssignments({ status: 'passed', date_from: dateFrom, date_to: dateTo, ...orgParams() });
  } catch (e) {
    grid.innerHTML = `<div class="col-span-7 text-center text-red-600 py-8">${t('error_generic')}</div>`;
    return;
  }

  // Группируем прошедших обучение по дню месяца (по дате фактической сдачи test_date)
  const byDay = {};
  list.forEach(a => {
    if (!a.test_date) return;
    const day = new Date(a.test_date).getDate();
    (byDay[day] = byDay[day] || []).push(a);
  });
  state.calendarByDay = byDay;

  const weekdayNames = CURRENT_LANG === 'kz' ? ['Дс','Сс','Ср','Бс','Жм','Сн','Жс'] : ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  let startWeekday = firstDay.getDay(); // 0=Sun
  startWeekday = startWeekday === 0 ? 6 : startWeekday - 1; // делаем понедельник первым днём недели
  const daysInMonth = lastDay.getDate();
  const todayStr = new Date().toDateString();

  let cells = weekdayNames.map(wd => `<div class="text-center text-xs font-bold text-slate-400 py-1">${wd}</div>`).join('');
  for (let i = 0; i < startWeekday; i++) cells += `<div></div>`;
  for (let day = 1; day <= daysInMonth; day++) {
    const count = (byDay[day] || []).length;
    const isToday = new Date(year, month, day).toDateString() === todayStr;
    cells += `
      <button onclick="showCalendarDay(${day})" class="aspect-square rounded-lg border ${isToday ? 'border-blue-400' : 'border-slate-100'} p-1.5 flex flex-col items-start justify-between hover:border-blue-400 hover:shadow-sm transition ${count ? 'bg-emerald-50' : 'bg-white'}">
        <span class="text-xs font-semibold ${isToday ? 'text-blue-600' : 'text-slate-600'}">${day}</span>
        ${count ? `<span class="text-[10px] font-bold text-emerald-700 bg-emerald-100 rounded px-1.5 py-0.5 self-end">${count}</span>` : ''}
      </button>
    `;
  }
  grid.innerHTML = cells;
}

function showCalendarDay(day) {
  const d = state.calendarDate;
  const list = (state.calendarByDay && state.calendarByDay[day]) || [];
  const dateLabel = new Date(d.getFullYear(), d.getMonth(), day).toLocaleDateString('ru-RU');
  document.getElementById('calDayTitle').textContent = `${t('calendar_completions_on')} — ${dateLabel}`;
  const listDiv = document.getElementById('calDayList');
  listDiv.innerHTML = list.length ? list.map(a => `
    <div class="flex items-center justify-between p-3 rounded-lg border border-slate-100 hover:bg-slate-50">
      <div>
        <button onclick="document.getElementById('calDayModal').classList.add('hidden'); openUserProfile(${a.user_id})" class="font-semibold text-sm text-slate-900 hover:text-blue-600 hover:underline text-left">${esc(a.last_name)} ${esc(a.first_name)}</button>
        <div class="text-xs text-slate-500">${esc(CURRENT_LANG === 'kz' ? a.title_kz : a.title_ru)}</div>
      </div>
      <span class="text-xs font-bold px-2 py-1 rounded bg-emerald-100 text-emerald-800">${a.score_percent}%</span>
    </div>
  `).join('') : `<div class="text-sm text-slate-400">${t('no_data')}</div>`;
  document.getElementById('calDayModal').classList.remove('hidden');
}

// --- MY TESTS (EMPLOYEE) ---
async function loadMyTests() {
  const list = await api.getMyAssignments();
  const div = document.getElementById('myTestsList');
  if (!div) return;
  if (!list.length) {
    div.innerHTML = '<div class="p-6 text-center text-slate-500">У вас нет назначенных тестов.</div>';
    return;
  }
  const isKz = CURRENT_LANG === 'kz';

  // Что сотруднику нужно сделать (0), что завершено неудачно без права пересдачи (1), что уже сдано (2)
  const rankOf = a => a.status === 'passed' ? 2 : (a.status === 'failed' && !a.retake_allowed) ? 1 : 0;
  const nTodo = list.filter(a => rankOf(a) === 0).length;
  const nFailed = list.filter(a => rankOf(a) === 1).length;
  const nPassed = list.filter(a => rankOf(a) === 2).length;

  const pill = (n, label, fg, bg) => n ? `<span class="text-xs font-bold px-3 py-1.5 rounded-full" style="background:${bg};color:${fg}">${label}: ${n}</span>` : '';
  const summary = `<div class="flex flex-wrap gap-2 mb-1">
    ${pill(nTodo, t('my_todo'), '#b45309', '#fffbeb')}
    ${pill(nPassed, t('my_passed'), '#047857', '#ecfdf5')}
    ${pill(nFailed, t('my_failed'), '#be123c', '#fff1f2')}
  </div>`;

  const cardHtml = (a, color) => {
    const title = isKz ? a.title_kz : a.title_ru;
    // Материалы/видео на языке интерфейса сотрудника; если для этого языка не загружено — берём другой язык, затем старые (legacy) поля
    const materialPath = (isKz ? a.material_pdf_path_kz : a.material_pdf_path_ru) || a.material_pdf_path_ru || a.material_pdf_path_kz || a.material_pdf_path;
    const videoPath = (isKz ? a.video_path_kz : a.video_path_ru) || a.video_path_ru || a.video_path_kz || a.video_path;
    const videoUrl = (isKz ? a.video_url_kz : a.video_url_ru) || a.video_url_ru || a.video_url_kz || a.video_url;
    const videoSrc = videoPath || videoUrl;
    return `
    <div class="p-5 border border-slate-200 rounded-xl bg-white flex flex-wrap justify-between items-center gap-4" style="border-left:4px solid ${color.fg}">
      <div>
        <h4 class="text-base font-bold text-slate-900">${esc(title)}</h4>
        <p class="text-xs text-slate-500 mt-1">Протокол № ${esc(a.protocol_number)} от ${esc(a.protocol_date)}</p>
        ${(materialPath || videoSrc) ? `
          <div class="mt-2 space-x-3 text-xs font-semibold">
            ${materialPath ? `<button type="button" onclick="openMediaViewer('${jsAttrEsc(materialPath)}', '${jsAttrEsc(title)}')" class="text-blue-600 hover:underline">📄 ${t('view_material')}</button>` : ''}
            ${videoSrc ? `<button type="button" onclick="openMediaViewer('${jsAttrEsc(videoSrc)}', '${jsAttrEsc(title)}')" class="text-blue-600 hover:underline">🎬 Видео</button>` : ''}
          </div>
        ` : ''}
      </div>
      <div class="flex items-center space-x-3">
        ${a.status === 'passed' ? `
          <span class="text-xs font-bold text-emerald-700 bg-emerald-50 px-3 py-1.5 rounded-lg">Сдано (${a.score_percent}%)</span>
          <a href="#" onclick="downloadAuthed('/api/certificates/${a.id}');return false;" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-xs font-semibold">${t('download_cert')}</a>
        ` : a.status === 'failed' && !a.retake_allowed ? `
          <span class="text-xs font-bold text-red-700 bg-red-50 px-3 py-1.5 rounded-lg">Не сдано (${a.score_percent}%)</span>
        ` : `
          <button type="button" onclick="runTest(${a.id}, '${jsAttrEsc(title)}', ${a.time_limit_minutes || 20})" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg text-sm shadow">
            ${a.retake_allowed ? 'Пересдать тест' : 'Начать тестирование'}
          </button>
        `}
      </div>
    </div>`;
  };

  // Разделы по категориям: сначала те, где есть что проходить; «Без категории» — в конце.
  // Внутри раздела: сначала то, что нужно пройти, затем неудачные, затем сданные (порядок по дате назначения сохраняется).
  const groups = groupCoursesByCategory(list).sort((g1, g2) =>
    (!g1.key - !g2.key) ||
    (g1.items.some(a => rankOf(a) === 0) ? 0 : 1) - (g2.items.some(a => rankOf(a) === 0) ? 0 : 1) ||
    g1.label.localeCompare(g2.label, isKz ? 'kk' : 'ru'));
  const showHeaders = groups.some(g => g.key);

  div.innerHTML = summary + groups.map(g => {
    const items = g.items.slice().sort((x, y) => rankOf(x) - rankOf(y));
    const doneCount = items.filter(a => rankOf(a) === 2).length;
    const header = showHeaders ? `
      <div class="flex items-center gap-3 mb-3 pb-2 border-b" style="border-color:${g.color.bd}">
        <span class="inline-block w-1.5 h-6 rounded-full" style="background:${g.color.fg}"></span>
        <h3 class="text-base font-bold text-slate-900">${esc(g.label)}</h3>
        <span class="ml-auto text-xs font-bold px-2 py-0.5 rounded-full" style="background:${g.color.bg};color:${g.color.fg}">${doneCount} / ${items.length}</span>
      </div>` : '';
    return `<section class="mt-5">${header}<div class="space-y-3">${items.map(a => cardHtml(a, g.color)).join('')}</div></section>`;
  }).join('');
}

function parseOpts(raw) {
  if (Array.isArray(raw)) return raw;
  try { return JSON.parse(raw); } catch (e) { return []; }
}

function onTestVisibilityChange() {
  if (document.hidden && state.activeTest) {
    state.activeTest.violations = (state.activeTest.violations || 0) + 1;
  }
}

let currentTestIndex = 0;

async function runTest(assignmentId, title, timeLimitMinutes) {
  let data;
  try {
    data = await api.startTest(assignmentId);
  } catch (e) {
    console.error('startTest failed', e);
    const raw = (e && e.message ? e.message : '').toLowerCase();
    const MESSAGES = [
      ['retake not allowed', 'Пересдача по этому курсу не разрешена. Попросите администратора открыть пересдачу в разделе «Назначения» (кнопка «Пересдача»).'],
      ['already passed', 'Тест по этому курсу уже сдан.'],
      ['already completed', 'Тест по этому курсу уже завершён.'],
      ['no questions', 'Для этого курса пока нет вопросов. Обратитесь к администратору.'],
      ['not found', 'Назначение не найдено — обновите страницу и попробуйте снова.'],
      ['expired', 'Срок прохождения теста истёк. Обратитесь к администратору.']
    ];
    const matched = MESSAGES.find(([key]) => raw.includes(key));
    const hint = matched
      ? matched[1]
      : e && e.status === 404
        ? 'Назначение не найдено или раздел тестирования недоступен на сервере.'
        : e && e.status === 403
          ? 'Тест уже пройден или пересдача пока не разрешена.'
          : (e && e.message ? e.message : 'ошибка сервера');
    alert(hint);
    // Список мог устареть — подтягиваем актуальные статусы.
    try { await loadMyTests(); } catch (err) { console.error('refresh after start failure', err); }
    return;
  }
  // Ограничиваем строго 10 вопросами
  const rawQuestions = Array.isArray(data)
    ? data
    : (data && (data.questions || data.items || (data.test && data.test.questions))) || [];
  const questions = rawQuestions.slice(0, 10);
  if (!questions.length) {
    alert('Для этого курса пока нет вопросов. Обратитесь к администратору.');
    return;
  }

  state.activeTest = {
    id: assignmentId,
    questions: questions,
    answers: {},
    violations: 0
  };
  currentTestIndex = 0;

  document.getElementById('testRunTitle').textContent = title;
  document.getElementById('testRunModal').classList.remove('hidden');
  // На телефоне без этого прокручивалась страница под окном, а не сам тест.
  document.body.style.overflow = 'hidden';

  renderTestStep();

  document.addEventListener('visibilitychange', onTestVisibilityChange);

  // Обратный отсчет таймера
  const timerEl = document.getElementById('testRunTimer');
  state.timeLeft = Math.max(1, parseInt(timeLimitMinutes, 10) || 20) * 60;
  const renderTimer = () => {
    const m = Math.floor(state.timeLeft / 60).toString().padStart(2, '0');
    const s = (state.timeLeft % 60).toString().padStart(2, '0');
    if (timerEl) timerEl.textContent = `${m}:${s}`;
  };
  renderTimer();
  if (state.timerInterval) clearInterval(state.timerInterval);
  state.timerInterval = setInterval(() => {
    state.timeLeft--;
    renderTimer();
    if (state.timeLeft <= 0) {
      clearInterval(state.timerInterval);
      alert('Время вышло! Тест будет завершен.');
      finishTest();
    }
  }, 1000);
}

function renderTestStep() {
  const test = state.activeTest;
  if (!test || !test.questions.length) return;

  const total = test.questions.length;
  const q = test.questions[currentTestIndex];

  document.getElementById('testRunSubtitle').textContent = `Вопрос ${currentTestIndex + 1} из ${total}`;

  // Рендерим кнопки 1..10 (зеленые — где уже выбран ответ, синяя — текущий)
  const pager = document.getElementById('testQuestionPager');
  pager.innerHTML = test.questions.map((item, idx) => {
    const isAnswered = test.answers[answerKey(item)] !== undefined;
    const isCurrent = idx === currentTestIndex;
    let cls = 'w-8 h-8 rounded-lg text-xs font-bold transition ';
    if (isCurrent) {
      cls += 'bg-blue-600 text-white ring-2 ring-blue-300';
    } else if (isAnswered) {
      cls += 'bg-emerald-100 text-emerald-800 border border-emerald-300';
    } else {
      cls += 'bg-slate-100 text-slate-600 hover:bg-slate-200';
    }
    return `<button type="button" onclick="goToQuestion(${idx})" class="${cls}">${idx + 1}</button>`;
  }).join('');

  // Текст вопроса и варианты
  const qText = CURRENT_LANG === 'kz' ? (q.question_kz || q.question_ru) : (q.question_ru || q.question_kz);
  const rawOpts = CURRENT_LANG === 'kz' ? (q.options_kz || q.options_ru) : (q.options_ru || q.options_kz);
  const opts = parseOpts(rawOpts);

  const container = document.getElementById('testRunQuestions');
  container.innerHTML = `
    <div class="space-y-4">
      <div class="font-semibold text-slate-900 text-base leading-snug">
        ${currentTestIndex + 1}. ${esc(qText)}
      </div>
      <div class="space-y-2.5 pt-2">
        ${opts.map((opt, optIdx) => {
          const qKey = answerKey(q);
          const checked = test.answers[qKey] === optIdx;
          return `
            <label class="flex items-center space-x-3 p-3 rounded-xl border ${checked ? 'border-blue-500 bg-blue-50/70 shadow-sm' : 'border-slate-200 bg-white hover:border-slate-300'} cursor-pointer text-sm transition">
              <input type="radio" name="active_q_${qKey}" value="${optIdx}" ${checked ? 'checked' : ''} onchange="setAnswer('${qKey}', ${optIdx})" onclick="setAnswer('${qKey}', ${optIdx})" class="text-blue-600 w-4 h-4">
              <span class="text-slate-800">${esc(opt)}</span>
            </label>
          `;
        }).join('')}
      </div>
    </div>
  `;

  document.getElementById('btnPrevQ').disabled = (currentTestIndex === 0);
  document.getElementById('btnNextQ').style.display = (currentTestIndex === total - 1) ? 'none' : 'inline-block';
}

function answerKey(q) {
  return String(q && (q.id !== undefined ? q.id : q.question_id));
}

function setAnswer(questionId, optIdx) {
  if (!state.activeTest) return;
  state.activeTest.answers[String(questionId)] = optIdx;
  renderTestStep();
}

// Снимаем выбранные варианты прямо из разметки — на случай, если событие
// change на мобильном не успело отработать до нажатия «Завершить тест».
function syncAnswersFromDom() {
  if (!state.activeTest) return;
  document.querySelectorAll('#testRunQuestions input[type="radio"]:checked').forEach((input) => {
    const qid = input.name.replace('active_q_', '');
    state.activeTest.answers[qid] = parseInt(input.value, 10);
  });
}

function goToQuestion(idx) {
  currentTestIndex = idx;
  renderTestStep();
}

function stepQuestion(delta) {
  const next = currentTestIndex + delta;
  if (next >= 0 && next < state.activeTest.questions.length) {
    currentTestIndex = next;
    renderTestStep();
  }
}

async function finishTest(auto) {
  if (!state.activeTest) return;
  // Сначала фиксируем отмеченный вариант текущего (в т.ч. последнего) вопроса,
  // и только потом спрашиваем подтверждение.
  syncAnswersFromDom();

  if (!auto) {
    const unanswered = state.activeTest.questions.filter(
      (q) => state.activeTest.answers[answerKey(q)] === undefined
    ).length;
    const question = unanswered
      ? `Без ответа осталось вопросов: ${unanswered}. Всё равно завершить тест?`
      : 'Вы уверены, что хотите завершить тест?';
    if (!confirm(question)) return;
  }

  clearInterval(state.timerInterval);
  clearInterval(state.testTimer);

  document.removeEventListener('visibilitychange', onTestVisibilityChange);
  const res = await api.submitTest(state.activeTest.id, state.activeTest.answers, state.activeTest.violations || 0);
  document.getElementById('testRunModal').classList.add('hidden');
  document.body.style.overflow = '';
  const prefix = auto ? 'Время вышло. ' : '';
  alert(res.passed ? `${prefix}Поздравляем! Тест сдан (${res.scorePercent}%)` : `${prefix}К сожалению, тест не сдан (${res.scorePercent}%)`);
  state.activeTest = null;
  loadMyTests();
}

// --- SETTINGS LOGIC ---
async function loadSettingsData() {
  const data = await api.getSettings();
  document.getElementById('setComp').value = data.company_name || '';
  document.getElementById('setChair1Name').value = data.chairman1_name || data.chairman_name || '';
  document.getElementById('setChair1Pos').value = data.chairman1_position || '';
  document.getElementById('setChair2Name').value = data.chairman2_name || '';
  document.getElementById('setChair2Pos').value = data.chairman2_position || '';
  const activeChair = parseInt(data.active_chairman, 10) === 2 ? '2' : '1';
  const rEl = document.querySelector(`input[name="activeChairman"][value="${activeChair}"]`);
  if (rEl) rEl.checked = true;
  document.getElementById('setCertPrefix').value = data.certificate_prefix || '';
  document.getElementById('setCertDigits').value = data.certificate_digits || 4;
  document.getElementById('setCertNext').value = data.certificate_next_number || 1;
  const pathField = { logo: 'logo_path', stamp: 'stamp_path' };
  ['logo', 'stamp'].forEach(kind => {
    const el = document.getElementById('set_' + kind + '_status');
    if (el && data[pathField[kind]]) {
      el.innerHTML = `Загружено: <a href="${data[pathField[kind]]}" target="_blank" class="text-blue-600 underline">открыть</a>`;
    }
  });
  [1, 2].forEach(n => {
    const el = document.getElementById('set_signature' + n + '_status');
    const val = data['chairman' + n + '_signature'];
    if (el && val) {
      el.innerHTML = `Загружено: <a href="${val}" target="_blank" class="text-blue-600 underline">открыть</a>`;
    }
  });
}

async function saveSettingsForm(e) {
  e.preventDefault();
  await api.saveSettings({
    company_name: document.getElementById('setComp').value.trim(),
    chairman1_name: document.getElementById('setChair1Name').value.trim(),
    chairman1_position: document.getElementById('setChair1Pos').value.trim(),
    chairman2_name: document.getElementById('setChair2Name').value.trim(),
    chairman2_position: document.getElementById('setChair2Pos').value.trim(),
    active_chairman: (document.querySelector('input[name="activeChairman"]:checked') || {}).value || '1',
    certificate_prefix: document.getElementById('setCertPrefix').value.trim(),
    certificate_digits: document.getElementById('setCertDigits').value,
    certificate_next_number: document.getElementById('setCertNext').value
  });
  // Обновляем название компании в шапке/логине сразу, без перезагрузки страницы
  PUBLIC_SETTINGS.company_name = document.getElementById('setComp').value.trim();
  alert('Настройки успешно сохранены!');
  render();
}

async function uploadBrandingFile(kind) {
  const input = document.getElementById('set_' + kind + '_file');
  const file = input.files[0];
  if (!file) { alert('Выберите файл.'); return; }
  const statusEl = document.getElementById('set_' + kind + '_status');
  try {
    if (statusEl) statusEl.textContent = 'Загрузка...';
    const fd = new FormData();
    fd.append('file', file);
    const res = await api.req('/api/settings/' + kind, { method: 'POST', body: fd });
    const pathField = { logo: 'logo_path', stamp: 'stamp_path' };
    if (statusEl) statusEl.innerHTML = `Загружено: <a href="${res[pathField[kind]]}" target="_blank" class="text-blue-600 underline">открыть</a>`;
    if (kind === 'logo') {
      // Логотип теперь должен отображаться и в шапке сайта, и на экране входа
      PUBLIC_SETTINGS.logo_path = res.logo_path;
      render();
    }
  } catch (e) {
    if (statusEl) statusEl.textContent = '';
    alert('Не удалось загрузить файл: ' + e.message);
  }
}

async function uploadChairmanSignature(n) {
  const input = document.getElementById('set_signature' + n + '_file');
  const file = input.files[0];
  if (!file) { alert('Выберите файл.'); return; }
  const statusEl = document.getElementById('set_signature' + n + '_status');
  try {
    if (statusEl) statusEl.textContent = 'Загрузка...';
    const fd = new FormData();
    fd.append('file', file);
    const res = await api.req('/api/settings/signature?chairman=' + n, { method: 'POST', body: fd });
    const val = res['chairman' + n + '_signature'];
    if (statusEl) statusEl.innerHTML = `Загружено: <a href="${val}" target="_blank" class="text-blue-600 underline">открыть</a>`;
  } catch (e) {
    if (statusEl) statusEl.textContent = '';
    alert('Не удалось загрузить файл: ' + e.message);
  }
}

// Init app
async function bootstrap() {
  try {
    PUBLIC_SETTINGS = await api.getPublicSettings();
  } catch (e) { /* логотип/название компании ещё не настроены — не критично */ }
  render();
}
bootstrap();
