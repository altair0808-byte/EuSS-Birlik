function setLang(lang) { CURRENT_LANG = lang; localStorage.setItem('lang', lang); }
const _L = (ru, kz) => (CURRENT_LANG === 'kz' ? kz : ru);


// --- STATE & API ---
const state = {
  token: localStorage.getItem('token') || null,
  user: JSON.parse(localStorage.getItem('user') || 'null'),
  tab: 'dashboard',
  courses: [],
  users: [],
  assignments: [],
  settings: {},
  activeTest: null,
  testTimer: null,
  timeLeft: 0,
  usersFilter: { q: '', object: '', department: '', role: '' },
  assignFilter: { status: '', object: '', department: '', q: '', date_from: '', date_to: '' },
  meta: { objects: [], departments: [], pairs: [] },
  metaLoaded: false,
  org: JSON.parse(sessionStorage.getItem('orgFilter') || '{"object":"","department":""}'),   // единый фильтр «объект / отдел» для всех вкладок
  profileUserId: null,
  calendarDate: new Date(),
  protocols: [],
  activeProtocols: [],
  protocolYear: null,          // выбранная вкладка-год во вкладке «Протоколы»
  protocolSortDesc: true,      // сортировка по дате открытия: true — новые сверху
  courseFilter: { q: '', cat: '*' },   // cat: '*' = все, '' = без категории, иначе ключ категории
  collapsedCats: new Set(),
  assignCat: '*'
};

function qs(obj) {
  const parts = Object.entries(obj).filter(([, v]) => v !== '' && v !== null && v !== undefined);
  if (!parts.length) return '';
  return '?' + parts.map(([k, v]) => encodeURIComponent(k) + '=' + encodeURIComponent(v)).join('&');
}

const api = {
  async req(url, opts = {}) {
    opts.headers = opts.headers || {};
    if (state.token) opts.headers['Authorization'] = 'Bearer ' + state.token;
    if (opts.body && !(opts.body instanceof FormData)) {
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(opts.body);
    }
    const res = await fetch(url, opts);
    if (res.status === 401) {
      logout();
      throw new Error('Unauthorized');
    }
    if (!res.ok) {
      const raw = await res.text().catch(() => '');
      let detail = '';
      try {
        const parsed = JSON.parse(raw);
        detail = parsed.message || parsed.error || '';
      } catch (e) {
        detail = (raw || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 200);
      }
      const err = new Error(detail || 'Ошибка запроса');
      err.status = res.status;
      err.url = url;
      throw err;
    }
    const ct = res.headers.get('content-type');
    if (ct && ct.includes('application/json')) return res.json();
    return res;
  },
  login(login, password) { return this.req('/api/auth/login', { method: 'POST', body: { login, password } }); },
  getUsers(filter = {}) { return this.req('/api/users' + qs(filter)); },
  getUser(id) { return this.req('/api/users/' + id); },
  getUsersMeta() { return this.req('/api/users/meta/objects'); },
  saveUser(data, id) { return this.req(id ? '/api/users/' + id : '/api/users', { method: id ? 'PUT' : 'POST', body: data }); },
  deleteUser(id) { return this.req('/api/users/' + id, { method: 'DELETE' }); },
  getCourses(filter = {}) { return this.req('/api/courses' + qs(filter)); },
  getCourse(id) { return this.req('/api/courses/' + id); },
  saveCourse(data, id) { return this.req(id ? '/api/courses/' + id : '/api/courses', { method: id ? 'PUT' : 'POST', body: data }); },
  deleteCourse(id) { return this.req('/api/courses/' + id, { method: 'DELETE' }); },

// Скачивание/открытие защищённых файлов (требующих Authorization),
// которые нельзя открыть обычной ссылкой <a href target="_blank">,
// т.к. браузер не добавляет заголовок Authorization при обычной навигации.
async function downloadAuthed(url, filename) {
  try {
    const res = await fetch(url, { headers: state.token ? { 'Authorization': 'Bearer ' + state.token } : {} });
    if (res.status === 401) { logout(); return; }
    if (!res.ok) {
      const err = await res.json().catch(() => ({ error: 'Ошибка сервера' }));
      alert(err.message || err.error || 'Не удалось скачать файл');
      return;
    }
    const blob = await res.blob();
    const blobUrl = URL.createObjectURL(blob);
    if (filename) {
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
    } else {
      window.open(blobUrl, '_blank');
    }
    setTimeout(() => URL.revokeObjectURL(blobUrl), 30000);
  } catch (e) {
    alert('Не удалось скачать файл: ' + e.message);
  }
}

// Экранирование текста перед вставкой в innerHTML (защита от XSS в ФИО/названиях)
function esc(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// Экранирование строки для безопасной вставки внутрь одинарных кавычек в inline-обработчике onclick="...('...')"
function jsAttrEsc(str) {
  return String(str ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

// --- ПРОСМОТР МАТЕРИАЛОВ И ВИДЕО ПРЯМО НА САЙТЕ (без открытия в отдельном окне) ---
function isVideoFileUrl(url) { return /\.(mp4|webm|ogg|mov|m4v|avi|mkv)(\?|#|$)/i.test(url); }
function isPdfFileUrl(url) { return /\.pdf(\?|#|$)/i.test(url); }
function isOfficeDocUrl(url) { return /\.(ppt|pptx|doc|docx|xls|xlsx)(\?|#|$)/i.test(url); }

function toYouTubeEmbedUrl(url) {
  try {
    const u = new URL(url, window.location.origin);
    const host = u.hostname.replace(/^www\./, '');
    let id = '';
    if (host === 'youtu.be') id = u.pathname.slice(1);
    else if (host === 'youtube.com' || host === 'm.youtube.com') {
      if (u.pathname === '/watch') id = u.searchParams.get('v') || '';
      else if (u.pathname.startsWith('/embed/')) return u.href;
      else if (u.pathname.startsWith('/shorts/')) id = u.pathname.split('/')[2] || '';
    } else {
      return null;
    }
    return id ? `https://www.youtube.com/embed/${id}` : null;
  } catch (e) { return null; }
}

// Открывает материал/видео (файл на сервере или внешняя ссылка, напр. YouTube) во встроенном
// модальном окне поверх сайта, вместо перехода в новую вкладку.
function openMediaViewer(url, title) {
  if (!url) return;
  const modal = document.getElementById('mediaViewerModal');
  const body = document.getElementById('mediaViewerBody');
  const titleEl = document.getElementById('mediaViewerTitle');
  const dl = document.getElementById('mediaViewerDownload');
  let absUrl;
  try { absUrl = new URL(url, window.location.origin).href; } catch (e) { absUrl = url; }

  titleEl.textContent = title || '';
  dl.href = absUrl;
  body.innerHTML = '';

  if (isPdfFileUrl(url)) {
    body.innerHTML = `<iframe src="${esc(absUrl)}" class="w-full h-full border-0"></iframe>`;
  } else if (isVideoFileUrl(url)) {
    body.innerHTML = `<video src="${esc(absUrl)}" controls autoplay class="w-full h-full bg-black"></video>`;
  } else if (isOfficeDocUrl(url)) {
    const officeUrl = 'https://view.officeapps.live.com/op/embed.aspx?src=' + encodeURIComponent(absUrl);
    body.innerHTML = `
      <iframe src="${esc(officeUrl)}" class="w-full h-full border-0"></iframe>
      <p class="text-[11px] text-slate-500 px-3 py-2 border-t border-slate-200">Если предпросмотр не отображается (например, сайт недоступен из интернета), воспользуйтесь ссылкой «Скачать» выше.</p>
    `;
  } else {
    const yt = toYouTubeEmbedUrl(url);
    if (yt) {
      body.innerHTML = `<iframe src="${esc(yt)}" class="w-full h-full border-0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
    } else {
      body.innerHTML = `<iframe src="${esc(absUrl)}" class="w-full h-full border-0"></iframe>`;
    }
  }

  modal.classList.remove('hidden');
  modal.classList.add('flex');
}

function closeMediaViewer() {
  const modal = document.getElementById('mediaViewerModal');
  const body = document.getElementById('mediaViewerBody');
  modal.classList.add('hidden');
  modal.classList.remove('flex');
  body.innerHTML = ''; // останавливает воспроизведение видео/iframe при закрытии
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeMediaViewer();
});

  const objs = (state.meta && state.meta.objects) || [];

}
function renderOrgBar() {
  const bar = document.getElementById('orgBar');
  if (!bar) return;
  bar.className = `flex flex-wrap items-center gap-2 mb-4 px-4 py-2.5 rounded-xl border shadow-sm ${orgActive() ? 'bg-blue-50 border-blue-200' : 'bg-white border-slate-200'}`;
  bar.innerHTML = orgBarInner();

async function refreshOrgMeta() {
  try {
    const meta = await api.getUsersMeta();
    state.meta = { objects: meta.objects || [], departments: meta.departments || [], pairs: meta.pairs || [] };
    state.metaLoaded = true;
    // сохранённый выбор мог исчезнуть (сотрудников объекта/отдела удалили) — тогда сбрасываем его
    let reset = false;
    if (state.org.object && !state.meta.objects.includes(state.org.object)) { state.org.object = ''; reset = true; }
    if (state.org.department && !state.meta.departments.includes(state.org.department)) { state.org.department = ''; reset = true; }
    if (reset) saveOrg();
    renderOrgBar();
    if (reset) loadTabContent();
  } catch (e) {}
}

function onOrgChange() {
  const o = document.getElementById('orgObject').value;
  let d = document.getElementById('orgDept').value;
  const objectChanged = o !== state.org.object;
  state.org.object = o;
  if (objectChanged && d && !orgDeptOptions(o).includes(d)) d = '';
  state.org.department = d;
  saveOrg();
  renderOrgBar();
  loadTabContent();          // перерисовываем только содержимое вкладки — строка фильтра остаётся
}
function resetOrg() {
  state.org = { object: '', department: '' };
  saveOrg();
  renderOrgBar();
  loadTabContent();
}

  if (!m) {
    m = document.createElement('div');
    m.id = 'exportModal';
    m.className = 'fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50';
    document.body.appendChild(m);
  }

function onExportObjectChange() {

async function submitExport() {
  const v = id => document.getElementById(id).value;
  const params = {
    object: v('exObject'), department: v('exDept'), course_id: v('exCourse'), status: v('exStatus'),
    validity: v('exValidity'), date_from: v('exFrom'), date_to: v('exTo'),
    sort: v('exSort'), split: v('exSplit'), latest: document.getElementById('exLatest').checked ? '1' : ''
  };
  const btn = document.getElementById('exSubmit');
  if (btn) { btn.disabled = true; btn.textContent = _L('Формируем файл…', 'Файл жасалуда…'); }
  await downloadAuthed('/api/export/excel' + qs(params), `Журнал_обучения_${exportTodayStr()}.xlsx`);
  if (btn) { btn.disabled = false; btn.textContent = '📥 ' + _L('Скачать Excel', 'Excel жүктеу'); }

}

// --- DASHBOARD: STATISTICS SPLIT BY COURSE (п.5 запроса) ---
let dashCourseStats = [];
let dashSelectedCourseId = null;

async function loadDashboardCourseStats() {
  const tabsDiv = document.getElementById('dashCourseTabs');
  const panelDiv = document.getElementById('dashCoursePanel');
  const mandCard = document.getElementById('dashMandatoryCard');
  if (!tabsDiv || !panelDiv) return;
  try {
    const summary = await api.getCourseStatsSummary(orgParams());
    dashCourseStats = summary.courses || [];

    if (mandCard) {
      const missing = summary.overall ? (summary.overall.employees_missing_mandatory || 0) : 0;
      const hasMandatory = dashCourseStats.some(c => c.is_mandatory);
      mandCard.classList.toggle('hidden', !hasMandatory);
      document.getElementById('dashMandatoryMissing').textContent = missing;
    }

    if (!dashCourseStats.length) {
      tabsDiv.innerHTML = `<div class="text-slate-400 text-sm">${t('no_data')}</div>`;
      panelDiv.innerHTML = '';
      return;
    }
    if (!dashSelectedCourseId || !dashCourseStats.some(c => String(c.id) === String(dashSelectedCourseId))) {
      dashSelectedCourseId = dashCourseStats[0].id;
    }
    renderDashCourseTabs();
    renderDashCoursePanel();
  } catch (e) {
    tabsDiv.innerHTML = `<div class="text-red-600 text-sm">${t('error_generic')}</div>`;
  }
}

function selectDashCourse(id) {
  dashSelectedCourseId = id;
  renderDashCourseTabs();
  renderDashCoursePanel();
}

function renderDashCourseTabs() {
  const tabsDiv = document.getElementById('dashCourseTabs');
  if (!tabsDiv) return;
  tabsDiv.innerHTML = dashCourseStats.map(c => {
    const on = String(c.id) === String(dashSelectedCourseId);
    const title = CURRENT_LANG === 'kz' ? (c.title_kz || c.title_ru) : (c.title_ru || c.title_kz);
    const flag = c.is_mandatory && (c.untrained || 0) > 0 ? ' ⚠' : '';
    return `<button type="button" onclick="selectDashCourse(${c.id})" class="px-3 py-1.5 rounded-full text-xs font-semibold border ${on ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-50'}">${esc(title)}${flag}</button>`;
  }).join('');
}

function renderDashCoursePanel() {
  const panelDiv = document.getElementById('dashCoursePanel');
  if (!panelDiv) return;
  const c = dashCourseStats.find(x => String(x.id) === String(dashSelectedCourseId));
  if (!c) { panelDiv.innerHTML = ''; return; }
  const cards = [
    { label: 'Сотрудников всего', value: c.total_employees, cls: 'text-slate-900' },
    { label: 'Прошли обучение', value: c.trained_employees, cls: 'text-emerald-600' },
    { label: 'Ожидают прохождения', value: c.pending, cls: 'text-amber-600' },
    { label: 'Не сдали', value: c.failed, cls: 'text-red-600' },
    { label: 'Просрочено', value: c.overdue, cls: 'text-red-600' }
  ];
  if (c.is_mandatory) {
    cards.push({ label: 'Не прошли обучение (обязательный курс)', value: c.untrained || 0, cls: (c.untrained || 0) > 0 ? 'text-red-600' : 'text-emerald-600' });
  }
  panelDiv.innerHTML = `
    <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
      ${cards.map(x => `
        <div class="border border-slate-200 rounded-lg p-3">
          <div class="text-[11px] font-bold text-slate-500 uppercase">${esc(x.label)}</div>
          <div class="text-xl font-black mt-1 ${x.cls}">${x.value}</div>
        </div>
      `).join('')}
    </div>
    ${c.is_mandatory ? `
      <div class="mt-3">
        <button type="button" onclick="setTab('courses'); setTimeout(() => openUntrainedModal(${c.id}, '${jsAttrEsc(CURRENT_LANG === 'kz' ? (c.title_kz || c.title_ru) : (c.title_ru || c.title_kz))}'), 50)" class="text-xs font-semibold text-blue-600 hover:underline">Список сотрудников, не прошедших курс &rarr;</button>
      </div>
    ` : ''}
  `;
}

// --- DASHBOARD: EXPIRING CERTIFICATES WIDGET (сортировка, фильтры, период, экспорт) ---
let expData = [];
const expState = { days: 30, q: '', course: '', status: '', sort: 'date_asc' };

function expDaysLeft(a) {
  return Math.ceil((new Date(a.next_test_date) - new Date()) / 86400000);
}

async function loadExpiringWidget() {
  const div = document.getElementById('expiringList');
  if (!div) return;
  try {
    expData = await api.getExpiring(expState.days, orgParams());
    renderExpiringFilters();
    renderExpiringList();
  } catch (e) {
    div.innerHTML = `<div class="text-sm text-red-600">${t('error_generic')}</div>`;
  }
}

function renderExpiringFilters() {
  const box = document.getElementById('expiringFilters');
  if (!box) return;
  const courseTitle = a => (CURRENT_LANG === 'kz' ? (a.title_kz || a.title_ru) : (a.title_ru || a.title_kz)) || '';
  const courses = [...new Set(expData.map(courseTitle).filter(Boolean))].sort((x, y) => x.localeCompare(y, 'ru'));
  // если ранее выбранного значения больше нет в данных (сменили период) — сбрасываем
  if (expState.course && !courses.includes(expState.course)) expState.course = '';
  const cls = 'border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white';
  const opt = (v, label, cur) => `<option value="${esc(String(v))}" ${String(cur) === String(v) ? 'selected' : ''}>${esc(label)}</option>`;
  box.innerHTML = `
    <div class="flex flex-wrap gap-2 items-center">
      <input id="expQ" type="text" value="${esc(expState.q)}" placeholder="${_L('Поиск по ФИО, курсу, объекту...', 'Аты-жөні, курс, объект бойынша іздеу...')}" oninput="onExpFilterChange()" class="flex-1 min-w-[200px] ${cls}">
      <select id="expDays" onchange="onExpDaysChange()" class="${cls}" title="${_L('Период', 'Кезең')}">
        ${[30, 60, 90, 180, 365].map(d => opt(d, `${_L('Срок', 'Мерзім')}: ${d} ${_L('дн.', 'күн')}`, expState.days)).join('')}
      </select>
      <select id="expStatus" onchange="onExpFilterChange()" class="${cls}">
        ${opt('', _L('Любой статус', 'Кез келген күй'), expState.status)}
        ${opt('overdue', _L('Просрочено', 'Мерзімі өткен'), expState.status)}
        ${opt('7', _L('Истекает ≤ 7 дней', '≤ 7 күнде аяқталады'), expState.status)}
        ${opt('14', _L('Истекает ≤ 14 дней', '≤ 14 күнде аяқталады'), expState.status)}
        ${opt('30', _L('Истекает ≤ 30 дней', '≤ 30 күнде аяқталады'), expState.status)}
      </select>
      <select id="expCourse" onchange="onExpFilterChange()" class="${cls}">
        ${opt('', _L('Все курсы', 'Барлық курстар'), expState.course)}${courses.map(c => opt(c, c, expState.course)).join('')}
      </select>
      <select id="expSort" onchange="onExpFilterChange()" class="${cls}" title="${_L('Сортировка', 'Сұрыптау')}">
        ${opt('date_asc', _L('Сначала срочные', 'Алдымен шұғылдар'), expState.sort)}
        ${opt('date_desc', _L('Сначала дальние', 'Алдымен алыстары'), expState.sort)}
        ${opt('name_asc', _L('ФИО А → Я', 'Аты-жөні А → Я'), expState.sort)}
        ${opt('name_desc', _L('ФИО Я → А', 'Аты-жөні Я → А'), expState.sort)}
        ${opt('course', _L('По курсу', 'Курс бойынша'), expState.sort)}
        ${opt('object', _L('По объекту', 'Объект бойынша'), expState.sort)}
      </select>
    </div>
    <div class="flex flex-wrap items-center gap-3 mt-2 text-xs text-slate-500">
      <span id="expCount"></span>
      <button type="button" onclick="resetExpFilters()" class="text-blue-600 hover:underline font-semibold">${_L('Сбросить фильтры', 'Сүзгілерді тазарту')}</button>
      <button type="button" onclick="exportExpiringCsv()" class="text-emerald-700 hover:underline font-semibold">⬇ CSV</button>
    </div>`;
}

let expFilterTimeout = null;
function onExpFilterChange() {
  expState.q = document.getElementById('expQ').value;
  expState.status = document.getElementById('expStatus').value;
  expState.course = document.getElementById('expCourse').value;
  expState.sort = document.getElementById('expSort').value;
  clearTimeout(expFilterTimeout);
  expFilterTimeout = setTimeout(renderExpiringList, 120);
}

function onExpDaysChange() {
  expState.days = Number(document.getElementById('expDays').value) || 30;
  loadExpiringWidget();
}

function resetExpFilters() {
  Object.assign(expState, { q: '', course: '', status: '', sort: 'date_asc' });
  renderExpiringFilters();
  renderExpiringList();
}

function getExpiringFiltered() {
  const q = expState.q.trim().toLowerCase();
  const title = a => (CURRENT_LANG === 'kz' ? (a.title_kz || a.title_ru) : (a.title_ru || a.title_kz)) || '';
  let list = expData.filter(a => {
    const dl = expDaysLeft(a);
    if (expState.status === 'overdue' && !(dl < 0)) return false;
    if (['7', '14', '30'].includes(expState.status) && !(dl >= 0 && dl <= Number(expState.status))) return false;
    if (expState.course && title(a) !== expState.course) return false;
    if (q) {
      const hay = `${a.last_name} ${a.first_name} ${title(a)} ${a.object || ''} ${a.department || ''} ${a.position || ''}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  const loc = CURRENT_LANG === 'kz' ? 'kk' : 'ru';
  const fio = a => `${a.last_name} ${a.first_name}`;
  const cmp = {
    date_asc: (a, b) => new Date(a.next_test_date) - new Date(b.next_test_date),
    date_desc: (a, b) => new Date(b.next_test_date) - new Date(a.next_test_date),
    name_asc: (a, b) => fio(a).localeCompare(fio(b), loc),
    name_desc: (a, b) => fio(b).localeCompare(fio(a), loc),
    course: (a, b) => title(a).localeCompare(title(b), loc) || fio(a).localeCompare(fio(b), loc),
    object: (a, b) => (a.object || '').localeCompare(b.object || '', loc) || fio(a).localeCompare(fio(b), loc)
  }[expState.sort] || (() => 0);
  return list.sort(cmp);
}

function renderExpiringList() {
  const div = document.getElementById('expiringList');
  if (!div) return;
  const list = getExpiringFiltered();
  const countEl = document.getElementById('expCount');
  if (countEl) countEl.textContent = `${_L('Показано', 'Көрсетілді')}: ${list.length} ${_L('из', '/')} ${expData.length}`;
  if (!expData.length) {
    div.innerHTML = `<div class="text-sm text-slate-500">${t('expiring_none')}</div>`;
    return;
  }
  if (!list.length) {
    div.innerHTML = `<div class="text-sm text-slate-500">${_L('Ничего не найдено по выбранным фильтрам', 'Таңдалған сүзгілер бойынша ештеңе табылмады')}</div>`;
    return;
  }
  div.innerHTML = list.map(a => {
    const nextDate = new Date(a.next_test_date);
    const daysLeft = expDaysLeft(a);
    const overdue = daysLeft < 0;
    const today = daysLeft === 0;
    const col = catColorOf(catKeyOf(a));   // цвет курса = цвет его категории (как на вкладке «Курсы»)
    const badgeClass = overdue ? 'bg-red-100 text-red-800' : daysLeft <= 7 ? 'bg-amber-100 text-amber-800' : 'bg-slate-100 text-slate-700';
    const badgeText = overdue ? `${Math.abs(daysLeft)} ${CURRENT_LANG === 'kz' ? 'күн' : 'дн.'} ${t('overdue')}` : today ? t('expires_today') : `${daysLeft} ${t('days_left')}`;
    return `
      <div class="flex flex-wrap items-center justify-between gap-2 p-3 rounded-lg border ${overdue ? 'border-red-200 bg-red-50/40' : 'border-slate-100'}">
        <div class="min-w-0">
          <div class="flex flex-wrap items-center gap-x-2 gap-y-1">
            <button onclick="openUserProfile(${a.user_id})" class="font-semibold text-slate-900 text-sm hover:text-blue-600 hover:underline text-left">${esc(a.last_name)} ${esc(a.first_name)}</button>
            <span class="text-xs font-semibold px-2 py-0.5 rounded-md" style="border:1.5px solid ${col.fg};background:${col.bg};color:${col.fg}" title="${esc(catLabelOf(a))}">${esc(CURRENT_LANG === 'kz' ? a.title_kz : a.title_ru)}</span>
          </div>
          <div class="text-xs text-slate-500 mt-0.5">${esc(a.object || '—')} / ${esc(a.department || '—')}</div>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-xs font-bold px-2.5 py-1 rounded-lg ${badgeClass}">${badgeText}</span>
          <span class="text-xs text-slate-400">${nextDate.toLocaleDateString('ru-RU')}</span>
        </div>
      </div>
    `;
  }).join('');
}

function exportExpiringCsv() {
  const list = getExpiringFiltered();
  const title = a => (CURRENT_LANG === 'kz' ? (a.title_kz || a.title_ru) : (a.title_ru || a.title_kz)) || '';
  const q = v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
  const rows = [['ФИО', 'Курс', 'Объект', 'Отдел', 'Должность', 'Действителен до', 'Осталось дней']];
  list.forEach(a => rows.push([`${a.last_name} ${a.first_name}`, title(a), a.object, a.department, a.position,
    new Date(a.next_test_date).toLocaleDateString('ru-RU'), expDaysLeft(a)]));
  const csv = '\uFEFF' + rows.map(r => r.map(q).join(';')).join('\r\n');
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = 'expiring.csv';
  document.body.appendChild(a); a.click(); a.remove();

// --- КАТЕГОРИИ КУРСОВ: единая систематизация обучения (список курсов, назначения, кабинет сотрудника) ---
const CAT_PALETTE = [
  { fg: '#1d4ed8', bg: '#eff6ff', bd: '#bfdbfe' },
  { fg: '#047857', bg: '#ecfdf5', bd: '#a7f3d0' },
  { fg: '#b45309', bg: '#fffbeb', bd: '#fde68a' },
  { fg: '#be123c', bg: '#fff1f2', bd: '#fecdd3' },
  { fg: '#6d28d9', bg: '#f5f3ff', bd: '#ddd6fe' },
  { fg: '#0e7490', bg: '#ecfeff', bd: '#a5f3fc' },
  { fg: '#c2410c', bg: '#fff7ed', bd: '#fed7aa' }
];
const CAT_NONE_COLOR = { fg: '#475569', bg: '#f1f5f9', bd: '#e2e8f0' };

// Ключ категории — русское название в нижнем регистре (если его нет — казахское). Пустая строка = без категории.
function catKeyOf(c) { return String((c && (c.category_ru || c.category_kz)) || '').trim().toLowerCase(); }
function catLabelOf(c) {
  const ru = String((c && c.category_ru) || '').trim();
  const kz = String((c && c.category_kz) || '').trim();
  return CURRENT_LANG === 'kz' ? (kz || ru) : (ru || kz);
}
// Цвет категории считается от её названия — поэтому одна и та же категория имеет один и тот же цвет на всех страницах
function catColorOf(key) {
  if (!key) return CAT_NONE_COLOR;
  let h = 0;
  for (const ch of key) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  return CAT_PALETTE[h % CAT_PALETTE.length];
}
function catBadgeHtml(c) {
  const key = catKeyOf(c);
  if (!key) return '';
  const col = catColorOf(key);
  return `<span class="inline-block text-[11px] font-semibold px-2 py-0.5 rounded-full border" style="background:${col.bg};color:${col.fg};border-color:${col.bd}">${esc(catLabelOf(c))}</span>`;
}
// Группы: категории по алфавиту, «Без категории» всегда в конце
function groupCoursesByCategory(items) {
  const map = new Map();
  items.forEach(it => {
    const key = catKeyOf(it);
    if (!map.has(key)) map.set(key, { key, label: catLabelOf(it) || t('cat_none'), color: catColorOf(key), items: [] });
    map.get(key).items.push(it);
  });
  const loc = CURRENT_LANG === 'kz' ? 'kk' : 'ru';
  return [...map.values()].sort((a, b) => (!a.key - !b.key) || a.label.localeCompare(b.label, loc));
}
function courseTitleOf(c) { return (CURRENT_LANG === 'kz' ? c.title_kz : c.title_ru) || c.title_ru || c.title_kz || ''; }

function renderCoursesList() {
  const div = document.getElementById('coursesList');
  if (!div) return;
  const all = state.courses || [];
  const q = (state.courseFilter.q || '').trim().toLowerCase();
  const found = q
    ? all.filter(c => `${c.title_ru} ${c.title_kz} ${c.category_ru || ''} ${c.category_kz || ''}`.toLowerCase().includes(q))
    : all;
  const groupsAll = groupCoursesByCategory(found);

  // Если выбранной категории больше нет (удалили/переименовали) — показываем все
  if (state.courseFilter.cat !== '*' && !groupsAll.some(g => g.key === state.courseFilter.cat)) state.courseFilter.cat = '*';
  const cur = state.courseFilter.cat;

  // Чипы категорий (быстрый фильтр). Если категорий нет вообще — чипы не нужны.
  const chips = document.getElementById('courseCatChips');
  const hasCategories = groupsAll.some(g => g.key);
  if (chips) {
    const chip = (key, label, n, col) => {
      const on = cur === key;
      const st = on ? `background:${col.fg};color:#fff;border-color:${col.fg}` : `background:${col.bg};color:${col.fg};border-color:${col.bd}`;
      return `<button type="button" data-key="${esc(key)}" onclick="setCourseCat(this.dataset.key)" class="px-3 py-1.5 rounded-full text-xs font-semibold border" style="${st}">${esc(label)} <span style="opacity:.7">${n}</span></button>`;
    };
    chips.innerHTML = hasCategories
      ? chip('*', t('cat_all'), found.length, { fg: '#1e293b', bg: '#ffffff', bd: '#cbd5e1' }) + groupsAll.map(g => chip(g.key, g.label, g.items.length, g.color)).join('')
      : '';
  }

  if (!all.length) {
    div.innerHTML = '<div class="p-8 text-center text-slate-500 border border-dashed rounded-xl">Курсов пока нет. Нажмите «+ Добавить курс», чтобы создать первый.</div>';
    return;
  }
  if (!found.length) {
    div.innerHTML = `<div class="p-6 text-center text-slate-400">${t('no_data')}</div>`;
    return;
  }

  const groups = cur === '*' ? groupsAll : groupsAll.filter(g => g.key === cur);
  const showHeaders = hasCategories;   // без категорий — плоский список, как раньше
  div.innerHTML = groups.map(g => {
    const collapsed = showHeaders && cur === '*' && state.collapsedCats.has(g.key);
    const cards = g.items.slice()
      .sort((a, b) => courseTitleOf(a).localeCompare(courseTitleOf(b), CURRENT_LANG === 'kz' ? 'kk' : 'ru'))
      .map(c => courseCardHtml(c, g.color)).join('');
    const header = showHeaders ? `
      <button type="button" data-key="${esc(g.key)}" onclick="toggleCourseCat(this.dataset.key)" class="w-full flex items-center gap-3 text-left mb-3 pb-2 border-b" style="border-color:${g.color.bd}">
        <span class="inline-block w-1.5 h-6 rounded-full" style="background:${g.color.fg}"></span>
        <span class="text-base font-bold text-slate-900">${esc(g.label)}</span>
        <span class="text-xs font-bold px-2 py-0.5 rounded-full" style="background:${g.color.bg};color:${g.color.fg}">${g.items.length}</span>
        <span class="ml-auto text-slate-400 text-xs">${collapsed ? '▸' : '▾'}</span>
      </button>` : '';
    return `<section>${header}${collapsed ? '' : `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">${cards}</div>`}</section>`;
  }).join('');
}

  const ru = [...seen.values()].map(c => c.category_ru).filter(Boolean);
  const kz = [...seen.values()].map(c => c.category_kz).filter(Boolean);
  const ruList = document.getElementById('courseCatListRu');
  const kzList = document.getElementById('courseCatListKz');
  if (ruList) ruList.innerHTML = ru.map(v => `<option value="${esc(v)}"></option>`).join('');
  if (kzList) kzList.innerHTML = kz.map(v => `<option value="${esc(v)}"></option>`).join('');
}

    document.getElementById('cCatRu').value = course.category_ru || '';
    document.getElementById('cCatKz').value = course.category_kz || '';
    document.getElementById('cTime').value = course.time_limit_minutes;
    document.getElementById('cPass').value = course.pass_score_percent;
    document.getElementById('cValid').value = course.validity_months;
    document.getElementById('cNoExpiry').checked = !!course.no_expiry;
    document.getElementById('cMandatory').checked = !!course.is_mandatory;
    onCourseNoExpiryToggle();
    // video_url_ru/kz — новые поля; video_url — старое поле для курсов, созданных до этого обновления
    document.getElementById('cVideoRu').value = course.video_url_ru || course.video_url || '';
    document.getElementById('cVideoKz').value = course.video_url_kz || '';
    renderMaterialStatus('ru', course.material_pdf_path_ru || course.material_pdf_path);
    renderMaterialStatus('kz', course.material_pdf_path_kz);
    renderVideoStatus('ru', course.video_path_ru || course.video_path);
    renderVideoStatus('kz', course.video_path_kz);
    document.getElementById('courseModalTitle').textContent = 'Редактировать курс';
  } else {
    document.getElementById('courseId').value = '';
    document.getElementById('cTitleRu').value = '';
    document.getElementById('cTitleKz').value = '';
    document.getElementById('cDescRu').value = '';
    document.getElementById('cDescKz').value = '';
    // Новый курс: если сейчас открыт раздел (категория) — подставляем её, чтобы курс сразу попал куда надо
    const curCat = state.courseFilter.cat;
    const curCourse = (curCat && curCat !== '*') ? (state.courses || []).find(c => catKeyOf(c) === curCat) : null;
    document.getElementById('cCatRu').value = curCourse ? (curCourse.category_ru || '') : '';
    document.getElementById('cCatKz').value = curCourse ? (curCourse.category_kz || '') : '';
    document.getElementById('cTime').value = 20;
    document.getElementById('cPass').value = 80;
    document.getElementById('cValid').value = 12;
    document.getElementById('cNoExpiry').checked = false;
    document.getElementById('cMandatory').checked = false;
    onCourseNoExpiryToggle();
    document.getElementById('cVideoRu').value = '';
    document.getElementById('cVideoKz').value = '';
    renderMaterialStatus('ru', null);
    renderMaterialStatus('kz', null);
    renderVideoStatus('ru', null);
    renderVideoStatus('kz', null);
    document.getElementById('courseModalTitle').textContent = 'Новый курс';
  }
  document.getElementById('courseModal').classList.remove('hidden');
}

// --- TESTS (QUESTIONS BY VARIANT) LOGIC ---
// Тестовая база курса организована как до 10 вариантов (билетов) по 10 вопросов,
// по 4 варианта ответа в каждом. Это позволяет выдавать сотрудникам разные билеты.
const TEST_VARIANTS_COUNT = 10;
let currentQuestionsCourseId = null;
let currentTestVariant = 1;
let allCourseQuestions = [];

async function openTestsModal(courseId) {
  currentQuestionsCourseId = courseId;
  currentTestVariant = 1;
  resetQuestionForm();
  document.getElementById('testImportStatus').innerHTML = '';
  document.getElementById('testImportFile').value = '';
  await loadQuestionsForCourse();
  document.getElementById('questionsModal').classList.remove('hidden');
}
// Сохраняем старое имя как алиас на случай, если где-то ещё осталась ссылка на него
function openQuestionsModal(courseId) { return openTestsModal(courseId); }

async function loadQuestionsForCourse() {
  const { course, questions } = await api.getCourse(currentQuestionsCourseId);
  document.getElementById('questionsModalTitle').textContent = 'Тесты курса: ' + course.title_ru;
  allCourseQuestions = questions;
  renderVariantTabs();
  renderVariantQuestions();
}

function renderVariantTabs() {
  const div = document.getElementById('variantTabs');
  const counts = {};
  allCourseQuestions.forEach(q => { counts[q.variant_number] = (counts[q.variant_number] || 0) + 1; });
  div.innerHTML = Array.from({ length: TEST_VARIANTS_COUNT }, (_, i) => i + 1).map(v => {
    const count = counts[v] || 0;
    const complete = count >= 10;
    const active = v === currentTestVariant;
    const colorClasses = active
      ? 'bg-blue-600 text-white'
      : (complete ? 'bg-emerald-50 text-emerald-700 hover:bg-emerald-100' : 'bg-slate-100 text-slate-600 hover:bg-slate-200');
    return `<button type="button" onclick="selectTestVariant(${v})" class="px-3 py-1.5 rounded-lg text-xs font-semibold ${colorClasses}">Билет ${v} (${count}/10)</button>`;
  }).join('');
}

function selectTestVariant(v) {
  currentTestVariant = v;
  resetQuestionForm();
  renderVariantTabs();
  renderVariantQuestions();
}

function renderVariantQuestions() {
  const container = document.getElementById('questionsList');
  if (!container) return;
  const list = allCourseQuestions.filter(q => (q.variant_number || 1) === currentTestVariant);

  if (!list.length) {
    container.innerHTML = '<div class="text-sm text-slate-400 py-4 text-center">В билете №' + currentTestVariant + ' пока нет вопросов. Добавьте первый ниже или загрузите тест из Excel.</div>';
    return;
  }

  container.innerHTML = list.map((q, idx) => {
    let opts = [];
    if (Array.isArray(q.options_ru)) {
      opts = q.options_ru;
    } else {
      try { opts = JSON.parse(q.options_ru || '[]'); } catch (e) { opts = []; }
    }

    return `
    <div class="border rounded-lg p-3 bg-slate-50">
      <div class="flex justify-between items-start">
        <div class="text-sm font-semibold text-slate-900">${idx + 1}. ${esc(q.question_ru)}</div>
        <div class="space-x-2 text-xs font-semibold whitespace-nowrap">
          <button type="button" onclick="editQuestionById(${q.id})" class="text-blue-600 hover:underline">Изменить</button>
          <button type="button" onclick="deleteQuestionRow(${q.id})" class="text-red-600 hover:underline">Удалить</button>
        </div>
      </div>
      <ul class="text-xs text-slate-600 mt-1 list-disc list-inside">
        ${opts.map((o, i) => `<li class="${i === q.correct_index ? 'text-emerald-700 font-semibold' : ''}">${esc(o)}${i === q.correct_index ? ' ✓' : ''}</li>`).join('')}
      </ul>
    </div>
    `;
  }).join('');
}

function resetQuestionForm() {
  document.getElementById('qId').value = '';
  document.getElementById('qVariant').value = currentTestVariant;
  document.getElementById('qVariantLabel').textContent = currentTestVariant;
  document.getElementById('qTextRu').value = '';
  document.getElementById('qTextKz').value = '';
  for (let i = 0; i < 4; i++) {
    document.getElementById('qOpt' + i + 'Ru').value = '';
    document.getElementById('qOpt' + i + 'Kz').value = '';
  }
  const r0 = document.getElementById('qCorrectR0');
  if (r0) r0.checked = true;
}

function editQuestionById(id) {
  const q = (allCourseQuestions || []).find(item => Number(item.id) === Number(id));
  if (!q) return;

  let optsRu = [], optsKz = [];
  try { optsRu = Array.isArray(q.options_ru) ? q.options_ru : JSON.parse(q.options_ru || '[]'); } catch (e) {}
  try { optsKz = Array.isArray(q.options_kz) ? q.options_kz : JSON.parse(q.options_kz || '[]'); } catch (e) {}

  document.getElementById('qId').value = q.id;
  document.getElementById('qVariant').value = q.variant_number || currentTestVariant;
  document.getElementById('qVariantLabel').textContent = q.variant_number || currentTestVariant;
  document.getElementById('qTextRu').value = q.question_ru || '';
  document.getElementById('qTextKz').value = q.question_kz || '';

  for (let i = 0; i < 4; i++) {
    document.getElementById('qOpt' + i + 'Ru').value = optsRu[i] || '';
    document.getElementById('qOpt' + i + 'Kz').value = optsKz[i] || '';
  }

  const radio = document.getElementById('qCorrectR' + (q.correct_index ?? 0));
  if (radio) radio.checked = true;

  // Плавный скролл к форме вопроса
  document.getElementById('qTextRu')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// Алиас для обратной совместимости
function editQuestionRow(q) {
  if (q && q.id) editQuestionById(q.id);
}

async function saveQuestionForm(e) {
  e.preventDefault();
   const qid = document.getElementById('qId').value;
  const currentCount = (allCourseQuestions || []).filter(q => Number(q.variant_number) === Number(currentTestVariant)).length;
  if (!qid && currentCount >= 10) {
    alert('В одном билете не может быть больше 10 вопросов. Удалите или измените существующие.');
    return;
  }
  const textRu = document.getElementById('qTextRu').value.trim();
  let textKz = document.getElementById('qTextKz').value.trim();

  if (!textRu) {
    alert('Пожалуйста, введите текст вопроса (RU).');
    return;
  }
  if (!textKz) textKz = textRu;

  const optsRu = [0, 1, 2, 3].map(i => document.getElementById('qOpt' + i + 'Ru').value.trim());
  let optsKz = [0, 1, 2, 3].map(i => document.getElementById('qOpt' + i + 'Kz').value.trim());

  if (optsRu.some(o => !o)) {
    alert('Заполните все 4 варианта ответа (RU).');
    return;
  }
  optsKz = optsKz.map((kz, i) => kz || optsRu[i]);

  const correctRadio = document.querySelector('input[name="qCorrectRadio"]:checked');
  if (!correctRadio) {
    alert('Отметьте точку правильного ответа слева от одного из вариантов.');
    return;
  }

  const data = {
    question_ru: textRu,
    question_kz: textKz,
    options_ru: optsRu,
    options_kz: optsKz,
    correct_index: parseInt(correctRadio.value, 10),
    variant_number: parseInt(document.getElementById('qVariant').value, 10) || currentTestVariant
  };

  try {
    if (qid) {
      await api.updateQuestion(currentQuestionsCourseId, qid, data);
    } else {
      await api.addQuestion(currentQuestionsCourseId, data);
    }
    resetQuestionForm();
    await loadQuestionsForCourse();
    loadCoursesList();
  } catch (err) {
    alert('Ошибка сохранения вопроса: ' + (err.message || 'Ошибка сервера'));
  }
}

async function deleteQuestionRow(qid) {
  if (!confirm('Удалить вопрос?')) return;
  try {
    await api.deleteQuestion(currentQuestionsCourseId, qid);
    await loadQuestionsForCourse();
    loadCoursesList();
  } catch (err) {
    alert('Ошибка при удалении: ' + (err.message || 'Ошибка сервера'));
  }
}

// --- Автоматическая загрузка теста из Excel ---
async function downloadTestTemplate() {
  try {
    const res = await api.req('/api/courses/questions-template.xlsx');
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'test_template.xlsx';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } catch (e) {
    alert('Не удалось скачать шаблон: ' + e.message);
  }
}

async function importTestFile() {
  const fileInput = document.getElementById('testImportFile');
  const file = fileInput.files[0];
  const mode = document.getElementById('testImportMode').value;
  const statusEl = document.getElementById('testImportStatus');
  if (!file) { alert('Выберите файл Excel (.xlsx) для загрузки.'); return; }
  if (mode === 'replace' && !confirm('Вся текущая база тестов этого курса будет удалена и заменена содержимым файла. Продолжить?')) return;

  statusEl.innerHTML = '<span class="text-slate-500">Загрузка и проверка файла...</span>';
  try {
    const fd = new FormData();
    fd.append('file', file);
    const res = await api.req('/api/courses/' + currentQuestionsCourseId + '/questions/import?mode=' + mode, { method: 'POST', body: fd });
    let html = `<span class="text-emerald-700 font-semibold">Загружено вопросов: ${res.imported}</span>`;
    if (res.skipped) {
      html += `<div class="text-amber-600 mt-1">Пропущено строк: ${res.skipped}</div>`;
      html += `<ul class="list-disc list-inside text-amber-600">${res.errors.slice(0, 15).map(e => `<li>${esc(e)}</li>`).join('')}</ul>`;
      if (res.errors.length > 15) html += `<div class="text-amber-600">...и ещё ${res.errors.length - 15}</div>`;
    }
    statusEl.innerHTML = html;
    fileInput.value = '';
    await loadQuestionsForCourse();
    loadCoursesList();
  } catch (e) {
    statusEl.innerHTML = `<span class="text-red-600">Ошибка загрузки: ${esc(e.message)}</span>`;
  }
}

// --- ASSIGNMENTS LOGIC ---
let assignFilterTimeout = null;
function onAssignFilterChange() {
  state.assignFilter.q = document.getElementById('aFilterQ').value;
  state.assignFilter.status = document.getElementById('aFilterStatus').value;
  state.assignFilter.date_from = document.getElementById('aFilterFrom').value;
  state.assignFilter.date_to = document.getElementById('aFilterTo').value;
  clearTimeout(assignFilterTimeout);
  assignFilterTimeout = setTimeout(loadAssignmentsList, 250);
}

function onAssignCatChange() {
  state.assignCat = document.getElementById('aFilterCat').value;
  loadAssignmentsList();
}

// Список категорий для фильтра берётся из самих назначений (до фильтрации), чтобы в нём были только реально используемые
function populateAssignCatFilter(fullList) {
  const sel = document.getElementById('aFilterCat');
  if (!sel) return;
  const groups = groupCoursesByCategory(fullList);
  if (state.assignCat !== '*' && !groups.some(g => g.key === state.assignCat)) state.assignCat = '*';
  const hasCategories = groups.some(g => g.key);
  sel.classList.toggle('hidden', !hasCategories);
  sel.innerHTML = `<option value="*">${t('all_categories')}</option>` +
    groups.map(g => `<option value="${esc(g.key)}" ${state.assignCat === g.key ? 'selected' : ''}>${esc(g.label)} (${g.items.length})</option>`).join('');
}

async function loadAssignmentsList() {
  const statusSel = document.getElementById('aFilterStatus');
  if (statusSel) statusSel.value = state.assignFilter.status;
  const fromInput = document.getElementById('aFilterFrom');
  if (fromInput) fromInput.value = state.assignFilter.date_from;
  const toInput = document.getElementById('aFilterTo');
  if (toInput) toInput.value = state.assignFilter.date_to;

  let list = await api.getAssignments({ ...state.assignFilter, ...orgParams() });
  populateAssignCatFilter(list);
  if (state.assignCat !== '*') list = list.filter(a => catKeyOf(a) === state.assignCat);
  state.assignments = list;
  const tbody = document.getElementById('assignTable');

  if (!list.length) {
    tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-400">${t('no_data')}</td></tr>`;
  } else {
    tbody.innerHTML = list.map(a => `
      <tr class="hover:bg-slate-50">
        <td class="px-4 py-3 font-medium">
          <button onclick="openUserProfile(${a.user_id})" class="hover:text-blue-600 hover:underline text-left">${esc(a.last_name)} ${esc(a.first_name)}</button>
          <br><span class="text-xs text-slate-400">${esc(a.position || '')}</span>
        </td>
        <td class="px-4 py-3">${esc(CURRENT_LANG === 'kz' ? a.title_kz : a.title_ru)}${catKeyOf(a) ? `<br>${catBadgeHtml(a)}` : ''}</td>
        <td class="px-4 py-3 text-xs text-slate-600">№ ${esc(a.protocol_number)}<br>${esc(a.protocol_date)}${a.test_date ? `<br><span class="text-slate-400">${t('test_date')}: ${new Date(a.test_date).toLocaleDateString('ru-RU')}</span>` : ''}</td>
        <td class="px-4 py-3">
          <span class="text-xs font-bold px-2 py-1 rounded ${a.status === 'passed' ? 'bg-emerald-100 text-emerald-800' : a.status === 'failed' ? 'bg-red-100 text-red-800' : 'bg-amber-100 text-amber-800'}">
            ${a.status === 'passed' ? 'СДАЛ' : a.status === 'failed' ? 'НЕ СДАЛ' : 'НАЗНАЧЕН'}
          </span>
        </td>
        <td class="px-4 py-3 font-bold">${a.score_percent !== null ? a.score_percent + '%' : '—'}</td>
        <td class="px-4 py-3 text-right space-x-2">
          ${a.status === 'passed' && a.certificate_number ? `<a href="#" onclick="downloadAuthed('/api/certificates/${a.id}');return false;" class="text-blue-600 hover:underline text-xs font-semibold">Сертификат</a>` : ''}
          ${a.status === 'failed' ? `<button onclick="allowRetake(${a.id})" class="text-amber-600 hover:underline text-xs">Пересдача</button>` : ''}

let asAllEmployees = [];
let asSelectedIds = new Set();
// Если назначение курса открыто с карточки сотрудника (п.1 запроса), сюда
// попадает id этого сотрудника — выбор в списке ниже блокируется на нём одном.
let asLockedUserId = null;

async function openAssignModal(presetUserId, presetUserIds, presetCourseId) {
  asLockedUserId = presetUserId ? Number(presetUserId) : null;
  const [allUsers, courses] = await Promise.all([api.getUsers(), api.getCourses()]);
  asAllEmployees = allUsers.filter(u => u.role === 'employee');
  if (asLockedUserId) {
    asSelectedIds = new Set([asLockedUserId]);
  } else if (presetUserIds && presetUserIds.length) {
    asSelectedIds = new Set(presetUserIds.map(Number));
  } else {
    asSelectedIds = new Set();
  }

  const cSel = document.getElementById('asCourseId');
  // Курсы в выпадающем списке сгруппированы по категориям — так проще найти нужный, когда курсов много
  const courseGroups = groupCoursesByCategory(courses);
  const flat = courseGroups.length === 1 && !courseGroups[0].key;
  const optHtml = c => `<option value="${c.id}">${esc(c.title_ru)}</option>`;
  const sortByRu = (a, b) => String(a.title_ru).localeCompare(String(b.title_ru), 'ru');
  cSel.innerHTML = flat
    ? courses.map(optHtml).join('')
    : courseGroups.map(g => `<optgroup label="${esc(g.label)}">${g.items.slice().sort(sortByRu).map(optHtml).join('')}</optgroup>`).join('');
  if (presetCourseId) cSel.value = presetCourseId;

  // Фильтры по объекту/отделу для списка сотрудников
  const objects = [...new Set(asAllEmployees.map(u => u.object).filter(Boolean))].sort();
  const departments = [...new Set(asAllEmployees.map(u => u.department).filter(Boolean))].sort();
  document.getElementById('asFilterObject').innerHTML = `<option value="">${t('all_objects')}</option>` + objects.map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join('');
  document.getElementById('asFilterDept').innerHTML = `<option value="">${t('all_departments')}</option>` + departments.map(d => `<option value="${esc(d)}">${esc(d)}</option>`).join('');
  document.getElementById('asFilterQ').value = '';

  // Если открыто с карточки сотрудника — скрываем список выбора сотрудников
  // и жёстко фиксируем назначение на одного человека (п.1 запроса).
  const titleEl = document.getElementById('assignModalTitle');
  const lockedInfo = document.getElementById('asLockedEmployeeInfo');
  const selBlock = document.getElementById('asEmployeeSelectionBlock');
  if (asLockedUserId) {
    const emp = asAllEmployees.find(u => String(u.id) === String(asLockedUserId));
    if (titleEl) titleEl.textContent = 'Назначить курс сотруднику';
    if (lockedInfo) {
      lockedInfo.classList.remove('hidden');
      lockedInfo.querySelector('div').textContent = emp ? `${emp.last_name} ${emp.first_name}` : '';
    }
    if (selBlock) selBlock.classList.add('hidden');
  } else {
    if (titleEl) titleEl.textContent = 'Назначить тестирование';
    if (lockedInfo) lockedInfo.classList.add('hidden');
    if (selBlock) selBlock.classList.remove('hidden');
  }

  document.getElementById('asHistorical').checked = false;
  document.getElementById('asHistoricalFields').classList.add('hidden');
  document.getElementById('asTestDate').value = '';
  document.getElementById('asTestDate').required = false;
  document.getElementById('asNextTestDate').value = '';
  document.getElementById('asScorePercent').value = '';

  document.getElementById('asProtDate').value = toLocalDateStr(new Date());
  try {
    const nums = await api.getLastNumbers();
    document.getElementById('asProtNum').value = nums.next_protocol_number || '1';
    const certHint = document.getElementById('asNextCertHint');
    if (certHint) certHint.textContent = nums.next_certificate_number ? `${t('hint_next_cert')}: ${nums.next_certificate_number}` : '';
  } catch (e) {
    document.getElementById('asProtNum').value = '1';
  }

  // Если сегодня действует открытый протокол (вкладка "Протоколы"), предупреждаем
  // администратора: итоговый номер будет присвоен автоматически при сдаче теста
  // сотрудником в период действия этого протокола, независимо от того, что введено ниже.
  const activeHint = document.getElementById('asActiveProtocolHint');
  if (activeHint) {
    activeHint.textContent = '';
    try {
      const active = await api.getActiveProtocols();
      if (active.length) {
        const p = active[0];
        activeHint.textContent = `Сейчас открыт протокол № ${p.protocol_number} (до ${fmtDate(p.close_date)}) — если сотрудник сдаст тест сегодня, ему автоматически будет присвоен именно этот номер.`;
      }
    } catch (e) {}
  }

  renderAssignEmployeeList();
  document.getElementById('assignModal').classList.remove('hidden');
}

function renderAssignEmployeeList() {
  const q = (document.getElementById('asFilterQ').value || '').toLowerCase();
  const obj = document.getElementById('asFilterObject').value;
  const dept = document.getElementById('asFilterDept').value;

  const filtered = asAllEmployees.filter(u => {
    if (obj && u.object !== obj) return false;
    if (dept && u.department !== dept) return false;
    if (q) {
      const hay = `${u.last_name} ${u.first_name} ${u.login}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  const div = document.getElementById('asEmployeeList');
  if (!filtered.length) {
    div.innerHTML = `<div class="p-3 text-xs text-slate-400 text-center">${t('no_data')}</div>`;
  } else {
    div.innerHTML = filtered.map(u => `
      <label class="flex items-center gap-2 px-3 py-2 text-sm hover:bg-slate-50 cursor-pointer">
        <input type="checkbox" value="${u.id}" ${asSelectedIds.has(u.id) ? 'checked' : ''} onchange="toggleAsEmployee(${u.id}, this.checked)" class="rounded text-blue-600">
        <span class="flex-1">${esc(u.last_name)} ${esc(u.first_name)}</span>
        <span class="text-xs text-slate-400">${esc(u.object || '—')}</span>
      </label>
    `).join('');
  }
  updateAsSelectedCount();
}

function toggleAsEmployee(id, checked) {
  if (checked) asSelectedIds.add(id); else asSelectedIds.delete(id);
  updateAsSelectedCount();
}

function asSelectAll(select) {
  const q = (document.getElementById('asFilterQ').value || '').toLowerCase();
  const obj = document.getElementById('asFilterObject').value;
  const dept = document.getElementById('asFilterDept').value;
  const filtered = asAllEmployees.filter(u => {
    if (obj && u.object !== obj) return false;
    if (dept && u.department !== dept) return false;
    if (q) {
      const hay = `${u.last_name} ${u.first_name} ${u.login}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  filtered.forEach(u => select ? asSelectedIds.add(u.id) : asSelectedIds.delete(u.id));
  renderAssignEmployeeList();
}

function updateAsSelectedCount() {
  const span = document.getElementById('asSelectedCount');
  if (span) span.textContent = asSelectedIds.size ? `(${asSelectedIds.size})` : '';
}

function onAsHistoricalToggle() {
  const on = document.getElementById('asHistorical').checked;
  document.getElementById('asHistoricalFields').classList.toggle('hidden', !on);
  document.getElementById('asTestDate').required = on;
}

async function submitAssignForm(e) {
  e.preventDefault();
  if (asSelectedIds.size === 0) {
    alert('Выберите хотя бы одного сотрудника.');
    return;
  }
  const historical = document.getElementById('asHistorical').checked;
  if (historical && !document.getElementById('asTestDate').value) {
    alert('Укажите дату прохождения для исторической записи.');
    return;
  }
  const data = {
    user_ids: [...asSelectedIds],
    course_id: document.getElementById('asCourseId').value,
    protocol_number: document.getElementById('asProtNum').value.trim(),
    protocol_date: document.getElementById('asProtDate').value
  };
  if (historical) {
    data.historical = true;
    data.test_date = document.getElementById('asTestDate').value;
    data.next_test_date = document.getElementById('asNextTestDate').value || undefined;
    data.score_percent = document.getElementById('asScorePercent').value || undefined;
  }
  const res = await api.createAssignmentsBulk(data);
  document.getElementById('assignModal').classList.add('hidden');
  if (res.skipped) {
    alert(`Назначено: ${res.created}. Пропущено (некорректный id): ${res.skipped}.`);
  }
  // Назначали с карточки сотрудника — обновляем именно её, а не список всех назначений
  if (asLockedUserId) {
    loadUserProfile(asLockedUserId);
  } else if (document.getElementById('assignTable')) {
    loadAssignmentsList();
  } else if (document.getElementById('coursesList')) {
    // Назначали "всем непрошедшим" со страницы курсов — обновляем счётчики на карточках
    loadCoursesList();
  }
}

async function allowRetake(id) {
  await api.allowRetake(id);
  loadAssignmentsList();
}

async function delAssign(id) {
  if (!confirm('Удалить назначение?')) return;
  await api.deleteAssignment(id);
  loadAssignmentsList();
}

// --- ПРОТОКОЛЫ (открытие/закрытие, п.1 и п.4) ---
function fmtDate(d) {
  if (!d) return '—';
  // Поле приходит как YYYY-MM-DD (DATE в postgres) — просто переставляем местами
  const s = String(d).slice(0, 10);
  const parts = s.split('-');
  return parts.length === 3 ? `${parts[2]}.${parts[1]}.${parts[0]}` : s;
}

function protocolYearOf(p) {
  return parseInt(String(p.open_date).slice(0, 4), 10);
}

function selectProtocolYear(year) {
  state.protocolYear = year;
  renderProtocolsView();
}

function toggleProtocolSort() {
  state.protocolSortDesc = !state.protocolSortDesc;
  renderProtocolsView();
}

async function loadProtocolsList() {
  const tbody = document.getElementById('protocolsTable');
  if (!tbody) return;
  try {
    state.protocols = await api.getProtocols(orgParams());
    renderProtocolsView();
  } catch (e) {
    tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-red-500">${t('error_generic')}</td></tr>`;
  }
}

// Вкладки по годам (год = год даты открытия протокола) + сортировка по дате открытия внутри года
function renderProtocolsView() {
  const tbody = document.getElementById('protocolsTable');
  const tabsEl = document.getElementById('protocolYearTabs');
  if (!tbody || !tabsEl) return;
  const list = state.protocols || [];
  const currentYear = new Date().getFullYear();

  const counts = {};
  list.forEach(p => { const y = protocolYearOf(p); counts[y] = (counts[y] || 0) + 1; });
  const years = Object.keys(counts).map(Number);
  if (!years.includes(currentYear)) years.push(currentYear);
  years.sort((x, y) => x - y);

  // По умолчанию — текущий год; если выбранного года больше нет в списке — тоже текущий
  if (!state.protocolYear || !years.includes(state.protocolYear)) state.protocolYear = currentYear;

  tabsEl.innerHTML = years.map(y => `
    <button type="button" onclick="selectProtocolYear(${y})"
      class="px-4 py-1.5 rounded-lg text-sm font-semibold border ${y === state.protocolYear ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'}">
      ${y}<span class="ml-1.5 text-xs font-normal ${y === state.protocolYear ? 'text-blue-100' : 'text-slate-400'}">${counts[y] || 0}</span>
    </button>
  `).join('');

  const sortBtn = document.getElementById('protocolSortBtn');
  if (sortBtn) sortBtn.textContent = state.protocolSortDesc ? 'По дате открытия: новые сверху ↓' : 'По дате открытия: старые сверху ↑';

  const rows = list.filter(p => protocolYearOf(p) === state.protocolYear).sort((p1, p2) => {
    const d = String(p1.open_date).localeCompare(String(p2.open_date)) || (Number(p1.id) - Number(p2.id));
    return state.protocolSortDesc ? -d : d;
  });

  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-400">${
      list.length && orgActive() ? 'По выбранному объекту/отделу за ' + state.protocolYear + ' год протоколов нет — сбросьте фильтр, чтобы увидеть все'
      : (!list.length && orgActive() ? 'По выбранному объекту/отделу протоколов нет — сбросьте фильтр, чтобы увидеть все'
      : 'За ' + state.protocolYear + ' год протоколов пока нет')}</td></tr>`;
    return;
  }

  const todayStr = toLocalDateStr(new Date());
  tbody.innerHTML = rows.map(p => {
    const isActiveNow = p.status === 'open' && String(p.open_date).slice(0,10) <= todayStr && todayStr <= String(p.close_date).slice(0,10);
    return `
    <tr class="hover:bg-slate-50">
      <td class="px-4 py-3 font-bold text-slate-900">№ ${esc(p.protocol_number)}</td>
      <td class="px-4 py-3 text-slate-600">${fmtDate(p.open_date)}</td>
      <td class="px-4 py-3 text-slate-600">${fmtDate(p.close_date)}</td>
      <td class="px-4 py-3">
        <span class="text-xs font-bold px-2 py-1 rounded ${p.status === 'open' ? (isActiveNow ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800') : 'bg-slate-100 text-slate-600'}">
          ${p.status === 'open' ? (isActiveNow ? 'ОТКРЫТ (действует сегодня)' : 'ОТКРЫТ') : 'ЗАКРЫТ'}
        </span>
      </td>
      <td class="px-4 py-3 text-slate-600">${p.assignments_count || 0}</td>
      <td class="px-4 py-3 text-right space-x-2 whitespace-nowrap">
        <button onclick="downloadProtocolDocx(${p.id})" class="text-indigo-600 hover:underline text-xs font-semibold">Скачать Word</button>
        <button onclick="editProtocol(${p.id})" class="text-blue-600 hover:underline text-xs">Изменить</button>
        ${p.status === 'open'
          ? `<button onclick="closeProtocolAction(${p.id})" class="text-amber-600 hover:underline text-xs">Закрыть</button>`
          : `<button onclick="reopenProtocolAction(${p.id})" class="text-emerald-600 hover:underline text-xs">Открыть снова</button>`}
        <button onclick="deleteProtocolAction(${p.id})" class="text-red-600 hover:underline text-xs">Удалить</button>
      </td>
    </tr>
  `;
  }).join('');
}

async function downloadProtocolDocx(id) {
  try {
    const res = await api.req('/api/protocols/' + id + '/download');
    const blob = await res.blob();
    // Имя файла приходит с сервера: «2026-09-20 Протокол по БиОТ № 027.docx»
    let name = 'protocol.docx';
    const m = (res.headers.get('content-disposition') || '').match(/filename\*=UTF-8''([^;]+)/i);
    if (m) { try { name = decodeURIComponent(m[1]); } catch (e) {} }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } catch (e) {
    alert('Не удалось скачать протокол: ' + e.message);
  }
}

// Предложить следующий номер по нумерации года даты открытия (пока номер не правили вручную)
async function suggestProtocolNumber() {
  const numEl = document.getElementById('protoNumber');
  const hintEl = document.getElementById('protoNumberHint');
  if (!numEl || numEl.dataset.auto !== '1') return;
  const year = String(document.getElementById('protoOpenDate').value || '').slice(0, 4) || String(new Date().getFullYear());
  try {
    const r = await api.getNextProtocolNumber(year);
    if (numEl.dataset.auto !== '1') return;   // пока грузилось, пользователь начал вводить вручную
    numEl.value = r.next_number;
    if (hintEl) hintEl.textContent = `Предложен следующий номер по нумерации ${year} года — можно изменить вручную.`;
  } catch (e) {
    if (hintEl) hintEl.textContent = 'Не удалось получить следующий номер — введите его вручную.';
  }
}

function protoOpenDateChanged() {
  suggestProtocolNumber();
}

function openProtocolModal(p = null) {
  const numEl = document.getElementById('protoNumber');
  const hintEl = document.getElementById('protoNumberHint');
  document.getElementById('protocolId').value = p ? p.id : '';
  numEl.value = p ? p.protocol_number : '';
  numEl.dataset.auto = p ? '' : '1';
  if (hintEl) hintEl.textContent = p ? '' : 'Подбираем следующий номер…';
  document.getElementById('protoOpenDate').value = p ? String(p.open_date).slice(0, 10) : toLocalDateStr(new Date());
  document.getElementById('protoCloseDate').value = p ? String(p.close_date).slice(0, 10) : toLocalDateStr(new Date());
  document.getElementById('protocolModalTitle').textContent = p ? 'Изменить протокол' : 'Открыть протокол';
  document.getElementById('protocolModal').classList.remove('hidden');
  if (!p) suggestProtocolNumber();
}

function editProtocol(id) {
  const p = (state.protocols || []).find(x => String(x.id) === String(id));
  if (p) openProtocolModal(p);
}

async function saveProtocolForm(e) {
  e.preventDefault();
  const id = document.getElementById('protocolId').value;
  const data = {
    protocol_number: document.getElementById('protoNumber').value.trim(),
    open_date: document.getElementById('protoOpenDate').value,
    close_date: document.getElementById('protoCloseDate').value
  };
  try {
    if (id) await api.updateProtocol(id, data);
    else await api.openProtocol(data);
    document.getElementById('protocolModal').classList.add('hidden');
    // Переходим на вкладку года, в котором открыт/изменён протокол
    state.protocolYear = parseInt(String(data.open_date).slice(0, 4), 10) || state.protocolYear;
    loadProtocolsList();
  } catch (e) {
    alert(e.message);
  }
}

async function closeProtocolAction(id) {

  await api.closeProtocol(id);
  loadProtocolsList();
}

async function reopenProtocolAction(id) {
  await api.reopenProtocol(id);
  loadProtocolsList();
}

async function deleteProtocolAction(id) {
  if (!confirm('Удалить протокол?')) return;
  try {
    await api.deleteProtocol(id);
    loadProtocolsList();
  } catch (e) {
    alert(e.message);
  }
}

async function loadUserProfile(userId) {
