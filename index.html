let CURRENT_LANG = localStorage.getItem('lang') || 'ru';
function t(key) { return (I18N[CURRENT_LANG] && I18N[CURRENT_LANG][key]) || key; }
function setLang(lang) { CURRENT_LANG = lang; localStorage.setItem('lang', lang); }


// --- STATE & API ---
const state = {
  token: localStorage.getItem('token') || null,
  user: JSON.parse(localStorage.getItem('user') || 'null'),
  tab: 'dashboard',
  courses: [],
  users: [],
  assignments: [],
  settings: {},
  activeTest: null,
  testTimer: null,
  timeLeft: 0
};

const api = {
  async req(url, opts = {}) {
    opts.headers = opts.headers || {};
    if (state.token) opts.headers['Authorization'] = 'Bearer ' + state.token;
    if (opts.body && !(opts.body instanceof FormData)) {
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(opts.body);
    }
    const res = await fetch(url, opts);
    if (res.status === 401) {
      logout();
      throw new Error('Unauthorized');
    }
    if (!res.ok) {
      const err = await res.json().catch(() => ({ error: 'Ошибка сервера' }));
      throw new Error(err.error || 'Ошибка запроса');
    }
    const ct = res.headers.get('content-type');
    if (ct && ct.includes('application/json')) return res.json();
    return res;
  },
  login(login, password) { return this.req('/api/auth/login', { method: 'POST', body: { login, password } }); },
  getUsers(params = '') { return this.req('/api/users' + params); },
  saveUser(data, id) { return this.req(id ? '/api/users/' + id : '/api/users', { method: id ? 'PUT' : 'POST', body: data }); },
  deleteUser(id) { return this.req('/api/users/' + id, { method: 'DELETE' }); },
  getCourses() { return this.req('/api/courses'); },
  getCourse(id) { return this.req('/api/courses/' + id); },
  saveCourse(data, id) { return this.req(id ? '/api/courses/' + id : '/api/courses', { method: id ? 'PUT' : 'POST', body: data }); },
  deleteCourse(id) { return this.req('/api/courses/' + id, { method: 'DELETE' }); },
  addQuestion(cid, data) { return this.req('/api/courses/' + cid + '/questions', { method: 'POST', body: data }); },
  deleteQuestion(qid) { return this.req('/api/courses/questions/' + qid, { method: 'DELETE' }); },
  getAssignments() { return this.req('/api/assignments'); },
  getMyAssignments() { return this.req('/api/assignments/mine'); },
  createAssignment(data) { return this.req('/api/assignments', { method: 'POST', body: data }); },
  deleteAssignment(id) { return this.req('/api/assignments/' + id, { method: 'DELETE' }); },
  allowRetake(id) { return this.req('/api/assignments/' + id + '/allow-retake', { method: 'POST' }); },
  startTest(id) { return this.req('/api/assignments/' + id + '/start', { method: 'POST' }); },
  submitTest(id, answers) { return this.req('/api/assignments/' + id + '/submit', { method: 'POST', body: { answers } }); },
  getSettings() { return this.req('/api/settings'); },
  saveSettings(data) { return this.req('/api/settings', { method: 'PUT', body: data }); }
};

function logout() {
  state.token = null;
  state.user = null;
  localStorage.removeItem('token');
  localStorage.removeItem('user');
  render();
}

function switchLang(l) {
  setLang(l);
  render();
}

// --- RENDER APP ---
function render() {
  const app = document.getElementById('app');
  if (!state.token || !state.user) {
    renderLogin(app);
    return;
  }
  renderMain(app);
}

function renderLogin(app) {
  app.innerHTML = `

      <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8 fade-in border border-slate-200">
        <div class="flex justify-between items-center mb-6">
          <span class="text-xs font-bold uppercase tracking-wider text-blue-600 bg-blue-50 px-2.5 py-1 rounded-full">Safety & Health</span>
          <button onclick="switchLang(CURRENT_LANG === 'ru' ? 'kz' : 'ru')" class="text-xs font-medium text-slate-600 hover:text-blue-600 border px-2 py-1 rounded">
            ${CURRENT_LANG === 'ru' ? 'ҚАЗ' : 'РУС'}
          </button>
        </div>
        <h1 class="text-2xl font-bold text-slate-900 mb-1">${t('login')}</h1>
        <p class="text-sm text-slate-500 mb-6">${t('app_title')}</p>
        
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">${t('login_field')}</label>
            <input type="text" id="loginInput" required placeholder="8888" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">${t('password_field')}</label>
            <input type="password" id="passInput" required class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
          <div id="loginError" class="text-sm text-red-600 hidden"></div>
          <button type="submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow transition">
            ${t('login_btn')}
          </button>
        </form>
      </div>
    </div>
  `;
}

async function handleLogin(e) {
  e.preventDefault();
  const errDiv = document.getElementById('loginError');
  errDiv.classList.add('hidden');
  const login = document.getElementById('loginInput').value.trim();
  const pass = document.getElementById('passInput').value;
  try {
    const res = await api.login(login, pass);
    state.token = res.token;
    state.user = res.user;
    localStorage.setItem('token', res.token);
    localStorage.setItem('user', JSON.stringify(res.user));
    state.tab = res.user.role === 'employee' ? 'my_tests' : 'dashboard';
    render();
  } catch (err) {
    errDiv.textContent = err.message || t('login_error');
    errDiv.classList.remove('hidden');
  }
}

          </div>

          <button onclick="switchLang(CURRENT_LANG === 'ru' ? 'kz' : 'ru')" class="text-xs font-semibold px-2.5 py-1.5 border rounded-lg text-slate-700 hover:bg-slate-50">

          <button onclick="logout()" class="text-xs font-semibold px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition">

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex space-x-1 sm:space-x-4 overflow-x-auto py-2">
          ${!isEmployee ? `
            <button onclick="setTab('dashboard')" class="px-3 py-1.5 text-xs font-semibold rounded-md ${state.tab === 'dashboard' ? 'bg-blue-600 text-white' : 'text-slate-600 hover:text-slate-900'}">${t('nav_dashboard')}</button>

async function loadUsersList() {
  const users = await api.getUsers();
  state.users = users;
  const tbody = document.getElementById('usersTable');
  if (!tbody) return;
  tbody.innerHTML = users.map(u => `
    <tr class="hover:bg-slate-50">
      <td class="px-4 py-3 font-medium text-slate-900">${u.last_name} ${u.first_name}</td>
      <td class="px-4 py-3 font-mono text-slate-600">${u.login}</td>
      <td class="px-4 py-3 text-slate-600">${u.object || '—'} / ${u.department || '—'}</td>
      <td class="px-4 py-3 text-slate-600">${u.position || '—'}</td>
      <td class="px-4 py-3"><span class="text-xs font-semibold px-2 py-0.5 rounded ${u.role === 'superadmin' ? 'bg-purple-100 text-purple-700' : u.role === 'admin' ? 'bg-blue-100 text-blue-700' : 'bg-slate-100 text-slate-700'}">${u.role}</span></td>
      <td class="px-4 py-3 text-right space-x-2">
        <button onclick="editUser(${u.id})" class="text-blue-600 hover:underline text-xs">Изменить</button>
        <button onclick="delUser(${u.id})" class="text-red-600 hover:underline text-xs">Удалить</button>
      </td>
    </tr>
  `).join('');
}

function openUserModal(u = null) {
  document.getElementById('userId').value = u ? u.id : '';
  document.getElementById('uLastName').value = u ? u.last_name : '';
  document.getElementById('uFirstName').value = u ? u.first_name : '';
  document.getElementById('uObject').value = u ? u.object : '';
  document.getElementById('uDept').value = u ? u.department : '';
  document.getElementById('uPos').value = u ? u.position : '';
  document.getElementById('uLogin').value = u ? u.login : '';
  document.getElementById('uPass').value = '';
  document.getElementById('uRole').value = u ? u.role : 'employee';
  document.getElementById('userModalTitle').textContent = u ? 'Редактировать сотрудника' : 'Добавить сотрудника';
  document.getElementById('userModal').classList.remove('hidden');
}

function closeUserModal() {
  document.getElementById('userModal').classList.add('hidden');
}

function editUser(id) {
  const u = state.users.find(x => x.id === id);
  if (u) openUserModal(u);
}

async function delUser(id) {
  if (!confirm('Удалить пользователя?')) return;
  await api.deleteUser(id);
  loadUsersList();
}

async function saveUserForm(e) {
  e.preventDefault();
  const id = document.getElementById('userId').value;
  const data = {
    last_name: document.getElementById('uLastName').value.trim(),
    first_name: document.getElementById('uFirstName').value.trim(),
    object: document.getElementById('uObject').value.trim(),
    department: document.getElementById('uDept').value.trim(),
    position: document.getElementById('uPos').value.trim(),
    login: document.getElementById('uLogin').value.trim(),
    role: document.getElementById('uRole').value
  };
  const pass = document.getElementById('uPass').value;
  if (pass) data.password = pass;
  await api.saveUser(data, id);
  closeUserModal();
  loadUsersList();
}

async function saveCourseForm(e) {
  e.preventDefault();
  const data = {
    title_ru: document.getElementById('cTitleRu').value.trim(),
    title_kz: document.getElementById('cTitleKz').value.trim(),
    time_limit_minutes: parseInt(document.getElementById('cTime').value) || 20,
    pass_score_percent: parseInt(document.getElementById('cPass').value) || 80,
    validity_months: parseInt(document.getElementById('cValid').value) || 12,
    video_url: document.getElementById('cVideo').value.trim()
  };
  await api.saveCourse(data);
  document.getElementById('courseModal').classList.add('hidden');
  loadCoursesList();
}

async function delCourse(id) {

}

  const cSel = document.getElementById('asCourseId');
  uSel.innerHTML = users.filter(u => u.role === 'employee').map(u => `<option value="${u.id}">${u.last_name} ${u.first_name} (${u.login})</option>`).join('');
  cSel.innerHTML = courses.map(c => `<option value="${c.id}">${c.title_ru}</option>`).join('');
  document.getElementById('asProtNum').value = '1';
  document.getElementById('asProtDate').value = new Date().toISOString().split('T')[0];
  document.getElementById('assignModal').classList.remove('hidden');
}

async function submitAssignForm(e) {
  e.preventDefault();
  const data = {
    user_id: document.getElementById('asUserId').value,
    course_id: document.getElementById('asCourseId').value,
    protocol_number: document.getElementById('asProtNum').value.trim(),
    protocol_date: document.getElementById('asProtDate').value
  };
  await api.createAssignment(data);
  document.getElementById('assignModal').classList.add('hidden');
  loadAssignmentsList();
}

async function allowRetake(id) {
  await api.allowRetake(id);
  loadAssignmentsList();
}

async function delAssign(id) {
  if (!confirm('Удалить назначение?')) return;
  await api.deleteAssignment(id);
  loadAssignmentsList();
}

// --- MY TESTS (EMPLOYEE) ---
async function loadMyTests() {
  const list = await api.getMyAssignments();
  const div = document.getElementById('myTestsList');
  if (!div) return;
  if (!list.length) {
    div.innerHTML = '<div class="p-6 text-center text-slate-500">У вас нет назначенных тестов.</div>';
    return;
  }
  div.innerHTML = list.map(a => `
    <div class="p-5 border border-slate-200 rounded-xl bg-white flex flex-wrap justify-between items-center gap-4">
      <div>
        <h4 class="text-base font-bold text-slate-900">${CURRENT_LANG === 'kz' ? a.course_title_kz : a.course_title_ru}</h4>
        <p class="text-xs text-slate-500 mt-1">Протокол № ${a.protocol_number} от ${a.protocol_date}</p>
      </div>
      <div class="flex items-center space-x-3">
        ${a.status === 'passed' ? `
          <span class="text-xs font-bold text-emerald-700 bg-emerald-50 px-3 py-1.5 rounded-lg">Сдано (${a.score_percent}%)</span>
          <a href="/api/certificates/${a.id}" target="_blank" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-xs font-semibold">Скачать сертификат</a>
        ` : a.status === 'failed' && !a.retake_allowed ? `
          <span class="text-xs font-bold text-red-700 bg-red-50 px-3 py-1.5 rounded-lg">Не сдано (${a.score_percent}%)</span>
        ` : `
          <button onclick="runTest(${a.id}, '${CURRENT_LANG === 'kz' ? a.course_title_kz : a.course_title_ru}')" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg text-sm shadow">
            ${a.retake_allowed ? 'Пересдать тест' : 'Начать тестирование'}
          </button>
        `}
      </div>
    </div>
  `).join('');
}

async function runTest(assignmentId, title) {
  const data = await api.startTest(assignmentId);
  state.activeTest = { id: assignmentId, questions: data.questions, answers: {} };
  document.getElementById('testRunTitle').textContent = title;
  
  const qDiv = document.getElementById('testRunQuestions');
  qDiv.innerHTML = data.questions.map((q, idx) => `
    <div class="p-4 border rounded-xl bg-slate-50">
      <div class="font-bold text-slate-900 mb-3 text-sm">${idx + 1}. ${CURRENT_LANG === 'kz' ? q.question_kz : q.question_ru}</div>
      <div class="space-y-2">
        ${(CURRENT_LANG === 'kz' ? q.options_kz : q.options_ru).map((opt, optIdx) => `
          <label class="flex items-center space-x-3 p-2 bg-white rounded-lg border hover:border-blue-400 cursor-pointer text-sm">
            <input type="radio" name="q_${q.id}" value="${optIdx}" onchange="state.activeTest.answers[${q.id}] = ${optIdx}" class="text-blue-600">
            <span>${opt}</span>
          </label>
        `).join('')}
      </div>
    </div>
  `).join('');

  document.getElementById('testRunModal').classList.remove('hidden');
}

async function finishTest() {
  if (!confirm('Вы уверены, что хотите завершить тест?')) return;
  const res = await api.submitTest(state.activeTest.id, state.activeTest.answers);
  document.getElementById('testRunModal').classList.add('hidden');
  alert(res.passed ? `Поздравляем! Тест сдан (${res.score_percent}%)` : `К сожалению, тест не сдан (${res.score_percent}%)`);
  loadMyTests();
}

// --- SETTINGS LOGIC ---
async function loadSettingsData() {
  const data = await api.getSettings();
  document.getElementById('setComp').value = data.company_name || '';
  document.getElementById('setChair').value = data.chairman_name || '';
}

async function saveSettingsForm(e) {
  e.preventDefault();
  await api.saveSettings({
    company_name: document.getElementById('setComp').value.trim(),
    chairman_name: document.getElementById('setChair').value.trim()
  });
  alert('Настройки успешно сохранены!');
}

// Init app
render();
</script>
</body>
</html>
