let CURRENT_LANG = localStorage.getItem('lang') || 'ru';
function t(key) { return (I18N[CURRENT_LANG] && I18N[CURRENT_LANG][key]) || key; }
function setLang(lang) { CURRENT_LANG = lang; localStorage.setItem('lang', lang); }


// --- STATE & API ---
const state = {
  token: localStorage.getItem('token') || null,
  user: JSON.parse(localStorage.getItem('user') || 'null'),
  tab: 'dashboard',
  courses: [],
  users: [],
  assignments: [],
  settings: {},
  activeTest: null,
  testTimer: null,
  timeLeft: 0,
  usersFilter: { q: '', object: '', department: '', role: '' },
  assignFilter: { status: '', object: '', department: '', q: '', date_from: '', date_to: '' },
  meta: { objects: [], departments: [] },
  profileUserId: null,
  calendarDate: new Date(),
  protocols: [],
  activeProtocols: []
};

function qs(obj) {
  const parts = Object.entries(obj).filter(([, v]) => v !== '' && v !== null && v !== undefined);
  if (!parts.length) return '';
  return '?' + parts.map(([k, v]) => encodeURIComponent(k) + '=' + encodeURIComponent(v)).join('&');
}

const api = {
  async req(url, opts = {}) {
    opts.headers = opts.headers || {};
    if (state.token) opts.headers['Authorization'] = 'Bearer ' + state.token;
    if (opts.body && !(opts.body instanceof FormData)) {
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(opts.body);
    }
    const res = await fetch(url, opts);
    if (res.status === 401) {
      logout();
      throw new Error('Unauthorized');
    }
    if (!res.ok) {
      const raw = await res.text().catch(() => '');
      let detail = '';
      try {
        const parsed = JSON.parse(raw);
        detail = parsed.message || parsed.error || '';
      } catch (e) {
        detail = (raw || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 200);
      }
      const err = new Error(detail || 'Ошибка запроса');
      err.status = res.status;
      err.url = url;
      throw err;
    }
    const ct = res.headers.get('content-type');
    if (ct && ct.includes('application/json')) return res.json();
    return res;
  },
  login(login, password) { return this.req('/api/auth/login', { method: 'POST', body: { login, password } }); },
  getUsers(filter = {}) { return this.req('/api/users' + qs(filter)); },
  getUser(id) { return this.req('/api/users/' + id); },
  getUsersMeta() { return this.req('/api/users/meta/objects'); },
  saveUser(data, id) { return this.req(id ? '/api/users/' + id : '/api/users', { method: id ? 'PUT' : 'POST', body: data }); },
  deleteUser(id) { return this.req('/api/users/' + id, { method: 'DELETE' }); },
  getCourses() { return this.req('/api/courses'); },
  getCourse(id) { return this.req('/api/courses/' + id); },
  saveCourse(data, id) { return this.req(id ? '/api/courses/' + id : '/api/courses', { method: id ? 'PUT' : 'POST', body: data }); },
  deleteCourse(id) { return this.req('/api/courses/' + id, { method: 'DELETE' }); },
  addQuestion(cid, data) { return this.req('/api/courses/' + cid + '/questions', { method: 'POST', body: data }); },
  deleteQuestion(cid, qid) { return this.req('/api/courses/' + cid + '/questions/' + qid, { method: 'DELETE' }); },
  updateQuestion(cid, qid, data) { return this.req('/api/courses/' + cid + '/questions/' + qid, { method: 'PUT', body: data }); },
  getAssignments(filter = {}) { return this.req('/api/assignments' + qs(filter)); },
  getExpiring(days = 30) { return this.req('/api/assignments/expiring' + qs({ days })); },
  getMyAssignments() { return this.req('/api/assignments/mine'); },
  createAssignment(data) { return this.req('/api/assignments', { method: 'POST', body: data }); },
  createAssignmentsBulk(data) { return this.req('/api/assignments/bulk', { method: 'POST', body: data }); },
  getLastNumbers() { return this.req('/api/assignments/last-numbers'); },
  deleteAssignment(id) { return this.req('/api/assignments/' + id, { method: 'DELETE' }); },
  allowRetake(id) { return this.req('/api/assignments/' + id + '/allow-retake', { method: 'POST' }); },
  startTest(id) { return this.req('/api/assignments/' + id + '/start', { method: 'POST' }); },
  submitTest(id, answers, focus_violations) { return this.req('/api/assignments/' + id + '/submit', { method: 'POST', body: { answers, focus_violations } }); },
  getSettings() { return this.req('/api/settings'); },
  saveSettings(data) { return this.req('/api/settings', { method: 'PUT', body: data }); },
  getPublicSettings() { return this.req('/api/settings/public'); },

// Скачивание/открытие защищённых файлов (требующих Authorization),
// которые нельзя открыть обычной ссылкой <a href target="_blank">,
// т.к. браузер не добавляет заголовок Authorization при обычной навигации.
async function downloadAuthed(url, filename) {
  try {
    const res = await fetch(url, { headers: state.token ? { 'Authorization': 'Bearer ' + state.token } : {} });
    if (res.status === 401) { logout(); return; }
    if (!res.ok) {
      const err = await res.json().catch(() => ({ error: 'Ошибка сервера' }));
      alert(err.message || err.error || 'Не удалось скачать файл');
      return;
    }
    const blob = await res.blob();
    const blobUrl = URL.createObjectURL(blob);
    if (filename) {
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
    } else {
      window.open(blobUrl, '_blank');
    }
    setTimeout(() => URL.revokeObjectURL(blobUrl), 30000);
  } catch (e) {
    alert('Не удалось скачать файл: ' + e.message);
  }
}

// Экранирование текста перед вставкой в innerHTML (защита от XSS в ФИО/названиях)
function esc(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// Экранирование строки для безопасной вставки внутрь одинарных кавычек в inline-обработчике onclick="...('...')"
function jsAttrEsc(str) {
  return String(str ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

// --- ПРОСМОТР МАТЕРИАЛОВ И ВИДЕО ПРЯМО НА САЙТЕ (без открытия в отдельном окне) ---
function isVideoFileUrl(url) { return /\.(mp4|webm|ogg|mov|m4v|avi|mkv)(\?|#|$)/i.test(url); }
function isPdfFileUrl(url) { return /\.pdf(\?|#|$)/i.test(url); }
function isOfficeDocUrl(url) { return /\.(ppt|pptx|doc|docx|xls|xlsx)(\?|#|$)/i.test(url); }

function toYouTubeEmbedUrl(url) {
  try {
    const u = new URL(url, window.location.origin);
    const host = u.hostname.replace(/^www\./, '');
    let id = '';
    if (host === 'youtu.be') id = u.pathname.slice(1);
    else if (host === 'youtube.com' || host === 'm.youtube.com') {
      if (u.pathname === '/watch') id = u.searchParams.get('v') || '';
      else if (u.pathname.startsWith('/embed/')) return u.href;
      else if (u.pathname.startsWith('/shorts/')) id = u.pathname.split('/')[2] || '';
    } else {
      return null;
    }
    return id ? `https://www.youtube.com/embed/${id}` : null;
  } catch (e) { return null; }
}

// Открывает материал/видео (файл на сервере или внешняя ссылка, напр. YouTube) во встроенном
// модальном окне поверх сайта, вместо перехода в новую вкладку.
function openMediaViewer(url, title) {
  if (!url) return;
  const modal = document.getElementById('mediaViewerModal');
  const body = document.getElementById('mediaViewerBody');
  const titleEl = document.getElementById('mediaViewerTitle');
  const dl = document.getElementById('mediaViewerDownload');
  let absUrl;
  try { absUrl = new URL(url, window.location.origin).href; } catch (e) { absUrl = url; }

  titleEl.textContent = title || '';
  dl.href = absUrl;
  body.innerHTML = '';

  if (isPdfFileUrl(url)) {
    body.innerHTML = `<iframe src="${esc(absUrl)}" class="w-full h-full border-0"></iframe>`;
  } else if (isVideoFileUrl(url)) {
    body.innerHTML = `<video src="${esc(absUrl)}" controls autoplay class="w-full h-full bg-black"></video>`;
  } else if (isOfficeDocUrl(url)) {
    const officeUrl = 'https://view.officeapps.live.com/op/embed.aspx?src=' + encodeURIComponent(absUrl);
    body.innerHTML = `
      <iframe src="${esc(officeUrl)}" class="w-full h-full border-0"></iframe>
      <p class="text-[11px] text-slate-500 px-3 py-2 border-t border-slate-200">Если предпросмотр не отображается (например, сайт недоступен из интернета), воспользуйтесь ссылкой «Скачать» выше.</p>
    `;
  } else {
    const yt = toYouTubeEmbedUrl(url);
    if (yt) {
      body.innerHTML = `<iframe src="${esc(yt)}" class="w-full h-full border-0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
    } else {
      body.innerHTML = `<iframe src="${esc(absUrl)}" class="w-full h-full border-0"></iframe>`;
    }
  }

  modal.classList.remove('hidden');
  modal.classList.add('flex');
}

function closeMediaViewer() {
  const modal = document.getElementById('mediaViewerModal');
  const body = document.getElementById('mediaViewerBody');
  modal.classList.add('hidden');
  modal.classList.remove('flex');
  body.innerHTML = ''; // останавливает воспроизведение видео/iframe при закрытии
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeMediaViewer();
});

// --- DASHBOARD: EXPIRING CERTIFICATES WIDGET ---
async function loadExpiringWidget() {
  const div = document.getElementById('expiringList');
  if (!div) return;
  try {
    const list = await api.getExpiring(30);
    if (!list.length) {
      div.innerHTML = `<div class="text-sm text-slate-500">${t('expiring_none')}</div>`;
      return;
    }
    const now = new Date();
    div.innerHTML = list.map(a => {
      const nextDate = new Date(a.next_test_date);
      const daysLeft = Math.ceil((nextDate - now) / (1000 * 60 * 60 * 24));
      const overdue = daysLeft < 0;
      const today = daysLeft === 0;
      const badgeClass = overdue ? 'bg-red-100 text-red-800' : daysLeft <= 7 ? 'bg-amber-100 text-amber-800' : 'bg-slate-100 text-slate-700';
      const badgeText = overdue ? `${Math.abs(daysLeft)} ${CURRENT_LANG === 'kz' ? 'күн' : 'дн.'} ${t('overdue')}` : today ? t('expires_today') : `${daysLeft} ${t('days_left')}`;
      return `
        <div class="flex flex-wrap items-center justify-between gap-2 p-3 rounded-lg border ${overdue ? 'border-red-200 bg-red-50/40' : 'border-slate-100'}">
          <div class="min-w-0">
            <button onclick="openUserProfile(${a.user_id})" class="font-semibold text-slate-900 text-sm hover:text-blue-600 hover:underline text-left">${esc(a.last_name)} ${esc(a.first_name)}</button>
            <div class="text-xs text-slate-500">${esc(a.object || '—')} / ${esc(a.department || '—')} · ${esc(CURRENT_LANG === 'kz' ? a.title_kz : a.title_ru)}</div>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold px-2.5 py-1 rounded-lg ${badgeClass}">${badgeText}</span>
            <span class="text-xs text-slate-400">${nextDate.toLocaleDateString('ru-RU')}</span>
          </div>
        </div>
      `;
    }).join('');
  } catch (e) {
    div.innerHTML = `<div class="text-sm text-red-600">${t('error_generic')}</div>`;
  }
}

// --- USERS LOGIC ---
async function downloadUsersTemplate() {
  try {
    const res = await api.req('/api/users/import-template.xlsx');
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'users_import_template.xlsx';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } catch (e) {
    alert('Не удалось скачать бланк: ' + e.message);
  }
}

async function handleImportFile(input) {
  const file = input.files[0];
  if (!file) return;
  const fd = new FormData();
  fd.append('file', file);
  try {
    const res = await api.req('/api/users/import', { method: 'POST', body: fd });
    let msg = `Импортировано сотрудников: ${res.created}.`;
    if (res.historyCreated) msg += ` Внесено записей об обучении: ${res.historyCreated}.`;
    if (res.skipped) msg += ` Пропущено: ${res.skipped}.`;
    if (res.errors && res.errors.length) msg += '\n\n' + res.errors.slice(0, 20).join('\n');
    alert(msg);
  } catch (e) {
    alert('Ошибка импорта: ' + e.message);
  }
  input.value = '';
  loadUsersList();
}

function openUserModal(u = null) {
  document.getElementById('userId').value = u ? u.id : '';
  document.getElementById('uLastName').value = u ? u.last_name : '';
  document.getElementById('uFirstName').value = u ? u.first_name : '';
  document.getElementById('uObject').value = u ? u.object : '';
  document.getElementById('uDept').value = u ? u.department : '';
  document.getElementById('uPos').value = u ? u.position : '';
  document.getElementById('uLogin').value = u ? u.login : '';
  document.getElementById('uPass').value = '';
  document.getElementById('uCertNumber').value = u ? (u.permanent_certificate_number || '') : '';
  document.getElementById('uRole').value = u ? u.role : 'employee';
  const roleWrapper = document.getElementById('roleFieldWrapper');
  if (roleWrapper) {
    if (state.user && state.user.role === 'superadmin') {
      roleWrapper.classList.remove('hidden');
    } else {
      roleWrapper.classList.add('hidden');
    }
  }
  document.getElementById('userModalTitle').textContent = u ? 'Редактировать сотрудника' : 'Добавить сотрудника';
  document.getElementById('userModal').classList.remove('hidden');
}

function closeUserModal() {
  document.getElementById('userModal').classList.add('hidden');
}

function editUser(id) {
  const u = state.users.find(x => x.id === id);
  if (u) openUserModal(u);
}

async function delUser(id) {
  if (!confirm('Удалить пользователя?')) return;
  await api.deleteUser(id);
  loadUsersList();
}

async function saveUserForm(e) {
  e.preventDefault();
  const id = document.getElementById('userId').value;
  const data = {
    last_name: document.getElementById('uLastName').value.trim(),
    first_name: document.getElementById('uFirstName').value.trim(),
    object: document.getElementById('uObject').value.trim(),
    department: document.getElementById('uDept').value.trim(),
    position: document.getElementById('uPos').value.trim(),
    login: document.getElementById('uLogin').value.trim(),
    role: document.getElementById('uRole').value,
    permanent_certificate_number: document.getElementById('uCertNumber').value.trim()
  };
  const pass = document.getElementById('uPass').value;
  if (pass) data.password = pass;
  await api.saveUser(data, id);
  closeUserModal();
  loadUsersList();
}

// --- TESTS (QUESTIONS BY VARIANT) LOGIC ---
// Тестовая база курса организована как до 10 вариантов (билетов) по 10 вопросов,
// по 4 варианта ответа в каждом. Это позволяет выдавать сотрудникам разные билеты.
const TEST_VARIANTS_COUNT = 10;
let currentQuestionsCourseId = null;
let currentTestVariant = 1;
let allCourseQuestions = [];

async function openTestsModal(courseId) {
  currentQuestionsCourseId = courseId;
  currentTestVariant = 1;
  resetQuestionForm();
  document.getElementById('testImportStatus').innerHTML = '';
  document.getElementById('testImportFile').value = '';
  await loadQuestionsForCourse();
  document.getElementById('questionsModal').classList.remove('hidden');
}
// Сохраняем старое имя как алиас на случай, если где-то ещё осталась ссылка на него
function openQuestionsModal(courseId) { return openTestsModal(courseId); }

async function loadQuestionsForCourse() {
  const { course, questions } = await api.getCourse(currentQuestionsCourseId);
  document.getElementById('questionsModalTitle').textContent = 'Тесты курса: ' + course.title_ru;
  allCourseQuestions = questions;
  renderVariantTabs();
  renderVariantQuestions();
}

function renderVariantTabs() {
  const div = document.getElementById('variantTabs');
  const counts = {};
  allCourseQuestions.forEach(q => { counts[q.variant_number] = (counts[q.variant_number] || 0) + 1; });
  div.innerHTML = Array.from({ length: TEST_VARIANTS_COUNT }, (_, i) => i + 1).map(v => {
    const count = counts[v] || 0;
    const complete = count >= 10;
    const active = v === currentTestVariant;
    const colorClasses = active
      ? 'bg-blue-600 text-white'
      : (complete ? 'bg-emerald-50 text-emerald-700 hover:bg-emerald-100' : 'bg-slate-100 text-slate-600 hover:bg-slate-200');
    return `<button type="button" onclick="selectTestVariant(${v})" class="px-3 py-1.5 rounded-lg text-xs font-semibold ${colorClasses}">Билет ${v} (${count}/10)</button>`;
  }).join('');
}

function selectTestVariant(v) {
  currentTestVariant = v;
  resetQuestionForm();
  renderVariantTabs();
  renderVariantQuestions();
}

function renderVariantQuestions() {
  const container = document.getElementById('questionsList');
  if (!container) return;
  const list = allCourseQuestions.filter(q => (q.variant_number || 1) === currentTestVariant);

  if (!list.length) {
    container.innerHTML = '<div class="text-sm text-slate-400 py-4 text-center">В билете №' + currentTestVariant + ' пока нет вопросов. Добавьте первый ниже или загрузите тест из Excel.</div>';
    return;
  }

  container.innerHTML = list.map((q, idx) => {
    let opts = [];
    if (Array.isArray(q.options_ru)) {
      opts = q.options_ru;
    } else {
      try { opts = JSON.parse(q.options_ru || '[]'); } catch (e) { opts = []; }
    }

    return `
    <div class="border rounded-lg p-3 bg-slate-50">
      <div class="flex justify-between items-start">
        <div class="text-sm font-semibold text-slate-900">${idx + 1}. ${esc(q.question_ru)}</div>
        <div class="space-x-2 text-xs font-semibold whitespace-nowrap">
          <button type="button" onclick="editQuestionById(${q.id})" class="text-blue-600 hover:underline">Изменить</button>
          <button type="button" onclick="deleteQuestionRow(${q.id})" class="text-red-600 hover:underline">Удалить</button>
        </div>
      </div>
      <ul class="text-xs text-slate-600 mt-1 list-disc list-inside">
        ${opts.map((o, i) => `<li class="${i === q.correct_index ? 'text-emerald-700 font-semibold' : ''}">${esc(o)}${i === q.correct_index ? ' ✓' : ''}</li>`).join('')}
      </ul>
    </div>
    `;
  }).join('');
}

function resetQuestionForm() {
  document.getElementById('qId').value = '';
  document.getElementById('qVariant').value = currentTestVariant;
  document.getElementById('qVariantLabel').textContent = currentTestVariant;
  document.getElementById('qTextRu').value = '';
  document.getElementById('qTextKz').value = '';
  for (let i = 0; i < 4; i++) {
    document.getElementById('qOpt' + i + 'Ru').value = '';
    document.getElementById('qOpt' + i + 'Kz').value = '';
  }
  const r0 = document.getElementById('qCorrectR0');
  if (r0) r0.checked = true;
}

function editQuestionById(id) {
  const q = (allCourseQuestions || []).find(item => Number(item.id) === Number(id));
  if (!q) return;

  let optsRu = [], optsKz = [];
  try { optsRu = Array.isArray(q.options_ru) ? q.options_ru : JSON.parse(q.options_ru || '[]'); } catch (e) {}
  try { optsKz = Array.isArray(q.options_kz) ? q.options_kz : JSON.parse(q.options_kz || '[]'); } catch (e) {}

  document.getElementById('qId').value = q.id;
  document.getElementById('qVariant').value = q.variant_number || currentTestVariant;
  document.getElementById('qVariantLabel').textContent = q.variant_number || currentTestVariant;
  document.getElementById('qTextRu').value = q.question_ru || '';
  document.getElementById('qTextKz').value = q.question_kz || '';

  for (let i = 0; i < 4; i++) {
    document.getElementById('qOpt' + i + 'Ru').value = optsRu[i] || '';
    document.getElementById('qOpt' + i + 'Kz').value = optsKz[i] || '';
  }

  const radio = document.getElementById('qCorrectR' + (q.correct_index ?? 0));
  if (radio) radio.checked = true;

  // Плавный скролл к форме вопроса
  document.getElementById('qTextRu')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// Алиас для обратной совместимости
function editQuestionRow(q) {
  if (q && q.id) editQuestionById(q.id);
}

async function saveQuestionForm(e) {
  e.preventDefault();
   const qid = document.getElementById('qId').value;
  const currentCount = (allCourseQuestions || []).filter(q => Number(q.variant_number) === Number(currentTestVariant)).length;
  if (!qid && currentCount >= 10) {
    alert('В одном билете не может быть больше 10 вопросов. Удалите или измените существующие.');
    return;
  }
  const textRu = document.getElementById('qTextRu').value.trim();
  let textKz = document.getElementById('qTextKz').value.trim();

  if (!textRu) {
    alert('Пожалуйста, введите текст вопроса (RU).');
    return;
  }
  if (!textKz) textKz = textRu;

  const optsRu = [0, 1, 2, 3].map(i => document.getElementById('qOpt' + i + 'Ru').value.trim());
  let optsKz = [0, 1, 2, 3].map(i => document.getElementById('qOpt' + i + 'Kz').value.trim());

  if (optsRu.some(o => !o)) {
    alert('Заполните все 4 варианта ответа (RU).');
    return;
  }
  optsKz = optsKz.map((kz, i) => kz || optsRu[i]);

  const correctRadio = document.querySelector('input[name="qCorrectRadio"]:checked');
  if (!correctRadio) {
    alert('Отметьте точку правильного ответа слева от одного из вариантов.');
    return;
  }

  const data = {
    question_ru: textRu,
    question_kz: textKz,
    options_ru: optsRu,
    options_kz: optsKz,
    correct_index: parseInt(correctRadio.value, 10),
    variant_number: parseInt(document.getElementById('qVariant').value, 10) || currentTestVariant
  };

  try {
    if (qid) {
      await api.updateQuestion(currentQuestionsCourseId, qid, data);
    } else {
      await api.addQuestion(currentQuestionsCourseId, data);
    }
    resetQuestionForm();
    await loadQuestionsForCourse();
    loadCoursesList();
  } catch (err) {
    alert('Ошибка сохранения вопроса: ' + (err.message || 'Ошибка сервера'));
  }
}

async function deleteQuestionRow(qid) {
  if (!confirm('Удалить вопрос?')) return;
  try {
    await api.deleteQuestion(currentQuestionsCourseId, qid);
    await loadQuestionsForCourse();
    loadCoursesList();
  } catch (err) {
    alert('Ошибка при удалении: ' + (err.message || 'Ошибка сервера'));
  }
}

// --- Автоматическая загрузка теста из Excel ---
async function downloadTestTemplate() {
  try {
    const res = await api.req('/api/courses/questions-template.xlsx');
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'test_template.xlsx';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } catch (e) {
    alert('Не удалось скачать шаблон: ' + e.message);
  }
}

async function importTestFile() {
  const fileInput = document.getElementById('testImportFile');
  const file = fileInput.files[0];
  const mode = document.getElementById('testImportMode').value;
  const statusEl = document.getElementById('testImportStatus');
  if (!file) { alert('Выберите файл Excel (.xlsx) для загрузки.'); return; }
  if (mode === 'replace' && !confirm('Вся текущая база тестов этого курса будет удалена и заменена содержимым файла. Продолжить?')) return;

  statusEl.innerHTML = '<span class="text-slate-500">Загрузка и проверка файла...</span>';
  try {
    const fd = new FormData();
    fd.append('file', file);
    const res = await api.req('/api/courses/' + currentQuestionsCourseId + '/questions/import?mode=' + mode, { method: 'POST', body: fd });
    let html = `<span class="text-emerald-700 font-semibold">Загружено вопросов: ${res.imported}</span>`;
    if (res.skipped) {
      html += `<div class="text-amber-600 mt-1">Пропущено строк: ${res.skipped}</div>`;
      html += `<ul class="list-disc list-inside text-amber-600">${res.errors.slice(0, 15).map(e => `<li>${esc(e)}</li>`).join('')}</ul>`;
      if (res.errors.length > 15) html += `<div class="text-amber-600">...и ещё ${res.errors.length - 15}</div>`;
    }
    statusEl.innerHTML = html;
    fileInput.value = '';
    await loadQuestionsForCourse();
    loadCoursesList();
  } catch (e) {
    statusEl.innerHTML = `<span class="text-red-600">Ошибка загрузки: ${esc(e.message)}</span>`;
  }
}

let asAllEmployees = [];
let asSelectedIds = new Set();

async function openAssignModal() {
  const [allUsers, courses] = await Promise.all([api.getUsers(), api.getCourses()]);
  asAllEmployees = allUsers.filter(u => u.role === 'employee');
  asSelectedIds = new Set();

  const cSel = document.getElementById('asCourseId');
  cSel.innerHTML = courses.map(c => `<option value="${c.id}">${esc(c.title_ru)}</option>`).join('');

  // Фильтры по объекту/отделу для списка сотрудников
  const objects = [...new Set(asAllEmployees.map(u => u.object).filter(Boolean))].sort();
  const departments = [...new Set(asAllEmployees.map(u => u.department).filter(Boolean))].sort();
  document.getElementById('asFilterObject').innerHTML = `<option value="">${t('all_objects')}</option>` + objects.map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join('');
  document.getElementById('asFilterDept').innerHTML = `<option value="">${t('all_departments')}</option>` + departments.map(d => `<option value="${esc(d)}">${esc(d)}</option>`).join('');
  document.getElementById('asFilterQ').value = '';
  document.getElementById('asHistorical').checked = false;
  document.getElementById('asHistoricalFields').classList.add('hidden');
  document.getElementById('asTestDate').value = '';
  document.getElementById('asTestDate').required = false;
  document.getElementById('asNextTestDate').value = '';
  document.getElementById('asScorePercent').value = '';

  document.getElementById('asProtDate').value = toLocalDateStr(new Date());
  try {
    const nums = await api.getLastNumbers();
    document.getElementById('asProtNum').value = nums.next_protocol_number || '1';
    const certHint = document.getElementById('asNextCertHint');
    if (certHint) certHint.textContent = nums.next_certificate_number ? `${t('hint_next_cert')}: ${nums.next_certificate_number}` : '';
  } catch (e) {
    document.getElementById('asProtNum').value = '1';
  }

  // Если сегодня действует открытый протокол (вкладка "Протоколы"), предупреждаем
  // администратора: итоговый номер будет присвоен автоматически при сдаче теста
  // сотрудником в период действия этого протокола, независимо от того, что введено ниже.
  const activeHint = document.getElementById('asActiveProtocolHint');
  if (activeHint) {
    activeHint.textContent = '';
    try {
      const active = await api.getActiveProtocols();
      if (active.length) {
        const p = active[0];

      }
    } catch (e) {}
  }

  renderAssignEmployeeList();
  document.getElementById('assignModal').classList.remove('hidden');
}

function renderAssignEmployeeList() {
  const q = (document.getElementById('asFilterQ').value || '').toLowerCase();
  const obj = document.getElementById('asFilterObject').value;
  const dept = document.getElementById('asFilterDept').value;

  const filtered = asAllEmployees.filter(u => {
    if (obj && u.object !== obj) return false;
    if (dept && u.department !== dept) return false;
    if (q) {
      const hay = `${u.last_name} ${u.first_name} ${u.login}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  const div = document.getElementById('asEmployeeList');
  if (!filtered.length) {
    div.innerHTML = `<div class="p-3 text-xs text-slate-400 text-center">${t('no_data')}</div>`;
  } else {
    div.innerHTML = filtered.map(u => `
      <label class="flex items-center gap-2 px-3 py-2 text-sm hover:bg-slate-50 cursor-pointer">
        <input type="checkbox" value="${u.id}" ${asSelectedIds.has(u.id) ? 'checked' : ''} onchange="toggleAsEmployee(${u.id}, this.checked)" class="rounded text-blue-600">

        <span class="text-xs text-slate-400">${esc(u.object || '—')}</span>

}

function toggleAsEmployee(id, checked) {

}

function asSelectAll(select) {
  const q = (document.getElementById('asFilterQ').value || '').toLowerCase();
  const obj = document.getElementById('asFilterObject').value;
  const dept = document.getElementById('asFilterDept').value;
  const filtered = asAllEmployees.filter(u => {
    if (obj && u.object !== obj) return false;
    if (dept && u.department !== dept) return false;
    if (q) {
      const hay = `${u.last_name} ${u.first_name} ${u.login}`.toLowerCase();

async function submitAssignForm(e) {

function fmtDate(d) {
  if (!d) return '—';
  // Поле приходит как YYYY-MM-DD (DATE в postgres) — просто переставляем местами
  const s = String(d).slice(0, 10);
  const parts = s.split('-');
  return parts.length === 3 ? `${parts[2]}.${parts[1]}.${parts[0]}` : s;
}

    body.innerHTML = `<div class="text-red-600 text-sm">${t('error_generic')}</div>`;
  }
}

// --- CALENDAR (АДМИН/СУПЕРАДМИН: КТО ПРОШЁЛ ОБУЧЕНИЕ В ВЫБРАННЫЕ ДАТЫ) ---
// Форматирует дату в YYYY-MM-DD по ЛОКАЛЬНОМУ времени (в отличие от toISOString,
// который переводит в UTC и может сдвинуть дату на день назад/вперёд для часовых поясов вроде UTC+5)
function toLocalDateStr(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function changeCalendarMonth(delta) {
  const d = new Date(state.calendarDate);
  d.setMonth(d.getMonth() + delta);
  state.calendarDate = d;
  loadCalendar();
}

async function loadCalendar() {
  const d = state.calendarDate;
  const year = d.getFullYear();
  const month = d.getMonth(); // 0-based
  const label = document.getElementById('calMonthLabel');
  const monthNames = CURRENT_LANG === 'kz'
    ? ['Қаңтар','Ақпан','Наурыз','Сәуір','Мамыр','Маусым','Шілде','Тамыз','Қыркүйек','Қазан','Қараша','Желтоқсан']
    : ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  if (label) label.textContent = `${monthNames[month]} ${year}`;

  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const dateFrom = toLocalDateStr(firstDay);
  const dateTo = toLocalDateStr(lastDay);

  const grid = document.getElementById('calGrid');
  if (!grid) return;
  grid.innerHTML = `<div class="col-span-7 text-center text-slate-400 py-8">${t('loading')}</div>`;

  let list = [];
  try {
    list = await api.getAssignments({ status: 'passed', date_from: dateFrom, date_to: dateTo });
  } catch (e) {
    grid.innerHTML = `<div class="col-span-7 text-center text-red-600 py-8">${t('error_generic')}</div>`;
    return;
  }

  // Группируем прошедших обучение по дню месяца (по дате фактической сдачи test_date)
  const byDay = {};
  list.forEach(a => {
    if (!a.test_date) return;
    const day = new Date(a.test_date).getDate();
    (byDay[day] = byDay[day] || []).push(a);
  });
  state.calendarByDay = byDay;

  const weekdayNames = CURRENT_LANG === 'kz' ? ['Дс','Сс','Ср','Бс','Жм','Сн','Жс'] : ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  let startWeekday = firstDay.getDay(); // 0=Sun
  startWeekday = startWeekday === 0 ? 6 : startWeekday - 1; // делаем понедельник первым днём недели
  const daysInMonth = lastDay.getDate();
  const todayStr = new Date().toDateString();

  let cells = weekdayNames.map(wd => `<div class="text-center text-xs font-bold text-slate-400 py-1">${wd}</div>`).join('');
  for (let i = 0; i < startWeekday; i++) cells += `<div></div>`;
  for (let day = 1; day <= daysInMonth; day++) {
    const count = (byDay[day] || []).length;
    const isToday = new Date(year, month, day).toDateString() === todayStr;
    cells += `
      <button onclick="showCalendarDay(${day})" class="aspect-square rounded-lg border ${isToday ? 'border-blue-400' : 'border-slate-100'} p-1.5 flex flex-col items-start justify-between hover:border-blue-400 hover:shadow-sm transition ${count ? 'bg-emerald-50' : 'bg-white'}">
        <span class="text-xs font-semibold ${isToday ? 'text-blue-600' : 'text-slate-600'}">${day}</span>
        ${count ? `<span class="text-[10px] font-bold text-emerald-700 bg-emerald-100 rounded px-1.5 py-0.5 self-end">${count}</span>` : ''}
      </button>
    `;
  }
  grid.innerHTML = cells;
}

function showCalendarDay(day) {
  const d = state.calendarDate;
  const list = (state.calendarByDay && state.calendarByDay[day]) || [];
  const dateLabel = new Date(d.getFullYear(), d.getMonth(), day).toLocaleDateString('ru-RU');
  document.getElementById('calDayTitle').textContent = `${t('calendar_completions_on')} — ${dateLabel}`;
  const listDiv = document.getElementById('calDayList');
  listDiv.innerHTML = list.length ? list.map(a => `
    <div class="flex items-center justify-between p-3 rounded-lg border border-slate-100 hover:bg-slate-50">
      <div>
        <button onclick="document.getElementById('calDayModal').classList.add('hidden'); openUserProfile(${a.user_id})" class="font-semibold text-sm text-slate-900 hover:text-blue-600 hover:underline text-left">${esc(a.last_name)} ${esc(a.first_name)}</button>
        <div class="text-xs text-slate-500">${esc(CURRENT_LANG === 'kz' ? a.title_kz : a.title_ru)}</div>
      </div>
      <span class="text-xs font-bold px-2 py-1 rounded bg-emerald-100 text-emerald-800">${a.score_percent}%</span>
    </div>
  `).join('') : `<div class="text-sm text-slate-400">${t('no_data')}</div>`;
  document.getElementById('calDayModal').classList.remove('hidden');
}

    const isKz = CURRENT_LANG === 'kz';
    // Материалы/видео на языке интерфейса сотрудника; если для этого языка не загружено — берём другой язык, затем старые (legacy) поля
    const materialPath = (isKz ? a.material_pdf_path_kz : a.material_pdf_path_ru) || a.material_pdf_path_ru || a.material_pdf_path_kz || a.material_pdf_path;
    const videoPath = (isKz ? a.video_path_kz : a.video_path_ru) || a.video_path_ru || a.video_path_kz || a.video_path;
    const videoUrl = (isKz ? a.video_url_kz : a.video_url_ru) || a.video_url_ru || a.video_url_kz || a.video_url;
    return `
    <div class="p-5 border border-slate-200 rounded-xl bg-white flex flex-wrap justify-between items-center gap-4">
      <div>
        <h4 class="text-base font-bold text-slate-900">${esc(CURRENT_LANG === 'kz' ? a.title_kz : a.title_ru)}</h4>
        <p class="text-xs text-slate-500 mt-1">Протокол № ${esc(a.protocol_number)} от ${esc(a.protocol_date)}</p>
        ${(materialPath || videoPath || videoUrl) ? `
          <div class="mt-2 space-x-3 text-xs font-semibold">
            ${materialPath ? `<button type="button" onclick="openMediaViewer('${jsAttrEsc(materialPath)}', '${jsAttrEsc(CURRENT_LANG === 'kz' ? a.title_kz : a.title_ru)}')" class="text-blue-600 hover:underline">📄 Материалы курса</button>` : ''}
            ${videoPath ? `<button type="button" onclick="openMediaViewer('${jsAttrEsc(videoPath)}', '${jsAttrEsc(CURRENT_LANG === 'kz' ? a.title_kz : a.title_ru)}')" class="text-blue-600 hover:underline">🎬 Видео</button>` : (videoUrl ? `<button type="button" onclick="openMediaViewer('${jsAttrEsc(videoUrl)}', '${jsAttrEsc(CURRENT_LANG === 'kz' ? a.title_kz : a.title_ru)}')" class="text-blue-600 hover:underline">🎬 Видео</button>` : '')}
          </div>
        ` : ''}
      </div>
      <div class="flex items-center space-x-3">
        ${a.status === 'passed' ? `
          <span class="text-xs font-bold text-emerald-700 bg-emerald-50 px-3 py-1.5 rounded-lg">Сдано (${a.score_percent}%)</span>
          <a href="#" onclick="downloadAuthed('/api/certificates/${a.id}');return false;" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-xs font-semibold">Скачать сертификат</a>
        ` : a.status === 'failed' && !a.retake_allowed ? `
          <span class="text-xs font-bold text-red-700 bg-red-50 px-3 py-1.5 rounded-lg">Не сдано (${a.score_percent}%)</span>
        ` : `
          <button type="button" onclick="runTest(${a.id}, '${jsAttrEsc(CURRENT_LANG === 'kz' ? a.title_kz : a.title_ru)}', ${a.time_limit_minutes || 20})" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg text-sm shadow">
            ${a.retake_allowed ? 'Пересдать тест' : 'Начать тестирование'}
          </button>
        `}
      </div>
    </div>
  `;
  }).join('');
}

function parseOpts(raw) {
  if (Array.isArray(raw)) return raw;
  try { return JSON.parse(raw); } catch (e) { return []; }
}

function onTestVisibilityChange() {
  if (document.hidden && state.activeTest) {
    state.activeTest.violations = (state.activeTest.violations || 0) + 1;
  }
}

let currentTestIndex = 0;

async function runTest(assignmentId, title, timeLimitMinutes) {
  let data;
  try {
    data = await api.startTest(assignmentId);
  } catch (e) {
    console.error('startTest failed', e);
    const raw = (e && e.message ? e.message : '').toLowerCase();
    const MESSAGES = [
      ['retake not allowed', 'Пересдача по этому курсу не разрешена. Попросите администратора открыть пересдачу в разделе «Назначения» (кнопка «Пересдача»).'],
      ['already passed', 'Тест по этому курсу уже сдан.'],
      ['already completed', 'Тест по этому курсу уже завершён.'],
      ['no questions', 'Для этого курса пока нет вопросов. Обратитесь к администратору.'],
      ['not found', 'Назначение не найдено — обновите страницу и попробуйте снова.'],
      ['expired', 'Срок прохождения теста истёк. Обратитесь к администратору.']
    ];
    const matched = MESSAGES.find(([key]) => raw.includes(key));
    const hint = matched
      ? matched[1]
      : e && e.status === 404
        ? 'Назначение не найдено или раздел тестирования недоступен на сервере.'
        : e && e.status === 403
          ? 'Тест уже пройден или пересдача пока не разрешена.'
          : (e && e.message ? e.message : 'ошибка сервера');
    alert(hint);
    // Список мог устареть — подтягиваем актуальные статусы.
    try { await loadMyTests(); } catch (err) { console.error('refresh after start failure', err); }
    return;
  }
  // Ограничиваем строго 10 вопросами
  const rawQuestions = Array.isArray(data)
    ? data
    : (data && (data.questions || data.items || (data.test && data.test.questions))) || [];
  const questions = rawQuestions.slice(0, 10);
  if (!questions.length) {
    alert('Для этого курса пока нет вопросов. Обратитесь к администратору.');
    return;
  }

  state.activeTest = {
    id: assignmentId,
    questions: questions,
    answers: {},
    violations: 0
  };
  currentTestIndex = 0;

  document.getElementById('testRunTitle').textContent = title;
  document.getElementById('testRunModal').classList.remove('hidden');
  // На телефоне без этого прокручивалась страница под окном, а не сам тест.
  document.body.style.overflow = 'hidden';

  renderTestStep();

  document.addEventListener('visibilitychange', onTestVisibilityChange);

  // Обратный отсчет таймера
  const timerEl = document.getElementById('testRunTimer');
  state.timeLeft = Math.max(1, parseInt(timeLimitMinutes, 10) || 20) * 60;
  const renderTimer = () => {
    const m = Math.floor(state.timeLeft / 60).toString().padStart(2, '0');
    const s = (state.timeLeft % 60).toString().padStart(2, '0');
    if (timerEl) timerEl.textContent = `${m}:${s}`;
  };
  renderTimer();
  if (state.timerInterval) clearInterval(state.timerInterval);
  state.timerInterval = setInterval(() => {
    state.timeLeft--;
    renderTimer();
    if (state.timeLeft <= 0) {
      clearInterval(state.timerInterval);
      alert('Время вышло! Тест будет завершен.');
      finishTest();
    }
  }, 1000);
}

function renderTestStep() {
  const test = state.activeTest;
  if (!test || !test.questions.length) return;

  const total = test.questions.length;
  const q = test.questions[currentTestIndex];

  document.getElementById('testRunSubtitle').textContent = `Вопрос ${currentTestIndex + 1} из ${total}`;

  // Рендерим кнопки 1..10 (зеленые — где уже выбран ответ, синяя — текущий)
  const pager = document.getElementById('testQuestionPager');
  pager.innerHTML = test.questions.map((item, idx) => {
    const isAnswered = test.answers[answerKey(item)] !== undefined;
    const isCurrent = idx === currentTestIndex;
    let cls = 'w-8 h-8 rounded-lg text-xs font-bold transition ';
    if (isCurrent) {
      cls += 'bg-blue-600 text-white ring-2 ring-blue-300';
    } else if (isAnswered) {
      cls += 'bg-emerald-100 text-emerald-800 border border-emerald-300';
    } else {
      cls += 'bg-slate-100 text-slate-600 hover:bg-slate-200';
    }
    return `<button type="button" onclick="goToQuestion(${idx})" class="${cls}">${idx + 1}</button>`;
  }).join('');

  // Текст вопроса и варианты
  const qText = CURRENT_LANG === 'kz' ? (q.question_kz || q.question_ru) : (q.question_ru || q.question_kz);
  const rawOpts = CURRENT_LANG === 'kz' ? (q.options_kz || q.options_ru) : (q.options_ru || q.options_kz);
  const opts = parseOpts(rawOpts);

  const container = document.getElementById('testRunQuestions');
  container.innerHTML = `
    <div class="space-y-4">
      <div class="font-semibold text-slate-900 text-base leading-snug">
        ${currentTestIndex + 1}. ${esc(qText)}
      </div>
      <div class="space-y-2.5 pt-2">
        ${opts.map((opt, optIdx) => {
          const qKey = answerKey(q);
          const checked = test.answers[qKey] === optIdx;
          return `
            <label class="flex items-center space-x-3 p-3 rounded-xl border ${checked ? 'border-blue-500 bg-blue-50/70 shadow-sm' : 'border-slate-200 bg-white hover:border-slate-300'} cursor-pointer text-sm transition">
              <input type="radio" name="active_q_${qKey}" value="${optIdx}" ${checked ? 'checked' : ''} onchange="setAnswer('${qKey}', ${optIdx})" onclick="setAnswer('${qKey}', ${optIdx})" class="text-blue-600 w-4 h-4">
              <span class="text-slate-800">${esc(opt)}</span>
            </label>
          `;
        }).join('')}
      </div>
    </div>
  `;

  document.getElementById('btnPrevQ').disabled = (currentTestIndex === 0);
  document.getElementById('btnNextQ').style.display = (currentTestIndex === total - 1) ? 'none' : 'inline-block';
}

function answerKey(q) {
  return String(q && (q.id !== undefined ? q.id : q.question_id));
}

function setAnswer(questionId, optIdx) {
  if (!state.activeTest) return;
  state.activeTest.answers[String(questionId)] = optIdx;
  renderTestStep();
}

// Снимаем выбранные варианты прямо из разметки — на случай, если событие
// change на мобильном не успело отработать до нажатия «Завершить тест».
function syncAnswersFromDom() {
  if (!state.activeTest) return;
  document.querySelectorAll('#testRunQuestions input[type="radio"]:checked').forEach((input) => {
    const qid = input.name.replace('active_q_', '');
    state.activeTest.answers[qid] = parseInt(input.value, 10);
  });
}

function goToQuestion(idx) {
  currentTestIndex = idx;
  renderTestStep();
}

function stepQuestion(delta) {
  const next = currentTestIndex + delta;
  if (next >= 0 && next < state.activeTest.questions.length) {
    currentTestIndex = next;
    renderTestStep();
  }
}

async function finishTest(auto) {
  if (!state.activeTest) return;
  // Сначала фиксируем отмеченный вариант текущего (в т.ч. последнего) вопроса,
  // и только потом спрашиваем подтверждение.
  syncAnswersFromDom();

  if (!auto) {
    const unanswered = state.activeTest.questions.filter(
      (q) => state.activeTest.answers[answerKey(q)] === undefined
    ).length;
    const question = unanswered
      ? `Без ответа осталось вопросов: ${unanswered}. Всё равно завершить тест?`
      : 'Вы уверены, что хотите завершить тест?';
    if (!confirm(question)) return;
  }

  clearInterval(state.timerInterval);
  clearInterval(state.testTimer);

  document.removeEventListener('visibilitychange', onTestVisibilityChange);
  const res = await api.submitTest(state.activeTest.id, state.activeTest.answers, state.activeTest.violations || 0);
  document.getElementById('testRunModal').classList.add('hidden');
  document.body.style.overflow = '';
  const prefix = auto ? 'Время вышло. ' : '';
  alert(res.passed ? `${prefix}Поздравляем! Тест сдан (${res.scorePercent}%)` : `${prefix}К сожалению, тест не сдан (${res.scorePercent}%)`);
  state.activeTest = null;
  loadMyTests();
}

// --- SETTINGS LOGIC ---
async function loadSettingsData() {
  const data = await api.getSettings();
  document.getElementById('setComp').value = data.company_name || '';
  document.getElementById('setChair1Name').value = data.chairman1_name || data.chairman_name || '';
  document.getElementById('setChair1Pos').value = data.chairman1_position || '';
  document.getElementById('setChair2Name').value = data.chairman2_name || '';
  document.getElementById('setChair2Pos').value = data.chairman2_position || '';
  document.getElementById('setProtPrefix').value = data.protocol_prefix || '';
  document.getElementById('setProtNext').value = data.protocol_next_number || 1;
  document.getElementById('setCertPrefix').value = data.certificate_prefix || '';
  document.getElementById('setCertDigits').value = data.certificate_digits || 4;
  document.getElementById('setCertNext').value = data.certificate_next_number || 1;
  const pathField = { logo: 'logo_path', stamp: 'stamp_path' };
  ['logo', 'stamp'].forEach(kind => {
    const el = document.getElementById('set_' + kind + '_status');
    if (el && data[pathField[kind]]) {
      el.innerHTML = `Загружено: <a href="${data[pathField[kind]]}" target="_blank" class="text-blue-600 underline">открыть</a>`;
    }
  });
  [1, 2].forEach(n => {
    const el = document.getElementById('set_signature' + n + '_status');
    const val = data['chairman' + n + '_signature'];
    if (el && val) {
      el.innerHTML = `Загружено: <a href="${val}" target="_blank" class="text-blue-600 underline">открыть</a>`;
    }
  });
}

async function saveSettingsForm(e) {
  e.preventDefault();
  await api.saveSettings({
    company_name: document.getElementById('setComp').value.trim(),
    chairman1_name: document.getElementById('setChair1Name').value.trim(),
    chairman1_position: document.getElementById('setChair1Pos').value.trim(),
    chairman2_name: document.getElementById('setChair2Name').value.trim(),
    chairman2_position: document.getElementById('setChair2Pos').value.trim(),
    protocol_prefix: document.getElementById('setProtPrefix').value.trim(),
    protocol_next_number: document.getElementById('setProtNext').value,
    certificate_prefix: document.getElementById('setCertPrefix').value.trim(),
    certificate_digits: document.getElementById('setCertDigits').value,
    certificate_next_number: document.getElementById('setCertNext').value
  });
  // Обновляем название компании в шапке/логине сразу, без перезагрузки страницы
  PUBLIC_SETTINGS.company_name = document.getElementById('setComp').value.trim();
  alert('Настройки успешно сохранены!');
  render();
}

async function uploadBrandingFile(kind) {
  const input = document.getElementById('set_' + kind + '_file');
  const file = input.files[0];
  if (!file) { alert('Выберите файл.'); return; }
  const statusEl = document.getElementById('set_' + kind + '_status');
  try {
    if (statusEl) statusEl.textContent = 'Загрузка...';
    const fd = new FormData();
    fd.append('file', file);
    const res = await api.req('/api/settings/' + kind, { method: 'POST', body: fd });
    const pathField = { logo: 'logo_path', stamp: 'stamp_path' };
    if (statusEl) statusEl.innerHTML = `Загружено: <a href="${res[pathField[kind]]}" target="_blank" class="text-blue-600 underline">открыть</a>`;
    if (kind === 'logo') {
      // Логотип теперь должен отображаться и в шапке сайта, и на экране входа
      PUBLIC_SETTINGS.logo_path = res.logo_path;
      render();
    }
  } catch (e) {
    if (statusEl) statusEl.textContent = '';
    alert('Не удалось загрузить файл: ' + e.message);
  }
}

async function uploadChairmanSignature(n) {
  const input = document.getElementById('set_signature' + n + '_file');
  const file = input.files[0];
  if (!file) { alert('Выберите файл.'); return; }
  const statusEl = document.getElementById('set_signature' + n + '_status');
  try {
    if (statusEl) statusEl.textContent = 'Загрузка...';
    const fd = new FormData();
    fd.append('file', file);
    const res = await api.req('/api/settings/signature?chairman=' + n, { method: 'POST', body: fd });
    const val = res['chairman' + n + '_signature'];
    if (statusEl) statusEl.innerHTML = `Загружено: <a href="${val}" target="_blank" class="text-blue-600 underline">открыть</a>`;
  } catch (e) {
    if (statusEl) statusEl.textContent = '';
    alert('Не удалось загрузить файл: ' + e.message);
  }
}

// Init app
async function bootstrap() {
  try {
    PUBLIC_SETTINGS = await api.getPublicSettings();
  } catch (e) { /* логотип/название компании ещё не настроены — не критично */ }
  render();
}
bootstrap();
</script>
